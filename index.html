<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registre de Transport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EFE8; --card:#FFFDF9; --ink:#1B1915; --ink2:#5A544B; --line:#E2DBCF;
  --accent:#B4441F; --accent-ink:#fff; --ok:#2F6B3F; --warn:#B07A12; --bad:#B3261E;
  --charbon:#2A2A2A; --sable:#C9973A; --chips:#6E7F8F; --terre:#A63D23;
  --r:14px; --sh:0 1px 0 rgba(27,25,21,.04),0 6px 24px -12px rgba(27,25,21,.18);
  --disp:'Archivo',system-ui,sans-serif; --txt:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font:400 15px/1.5 var(--txt);color:var(--ink);background:var(--paper);min-height:100vh}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* Layout */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
body{overflow-x:hidden}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 18px;
  background:rgba(243,239,232,.82);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid transparent}
header.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:800 17px/1 var(--disp);letter-spacing:-.02em;text-transform:uppercase}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.brand small{display:block;font:500 11px/1.2 var(--txt);letter-spacing:.04em;color:var(--ink2);text-transform:none;margin-top:3px}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.sync.on i{background:var(--ok)} .sync.off i{background:var(--bad)}
main{padding:8px 18px 120px;max-width:1180px;width:100%;margin:0 auto}
.view{display:none} .view.active{display:block;animation:in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h1{font:800 clamp(28px,6vw,44px)/1.02 var(--disp);letter-spacing:-.03em;margin:14px 0 4px}
h2{font:700 19px/1.2 var(--disp);letter-spacing:-.015em}
.lede{color:var(--ink2);max-width:60ch}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

/* Tab bar */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:30;display:flex;gap:4px;padding:6px;
  background:rgba(27,25,21,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;box-shadow:0 10px 40px -10px rgba(0,0,0,.45)}
nav.tabs button{border:0;background:none;color:#CFC8BC;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:68px;min-height:48px;padding:6px 10px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button.on{background:rgba(255,255,255,.12);color:#fff}
nav.tabs button.add{background:var(--accent);color:#fff}
@media(min-width:760px){.col-route{order:2}#next{display:none}}
nav.tabs button:active{transform:scale(.96)}

/* Cards / KPI */
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr));margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.kpi{padding:14px 14px 12px}
.kpi .v{font:500 24px/1.1 var(--mono);letter-spacing:-.03em;margin-top:8px}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:4px}
.kpi.lead{grid-column:1/-1;background:var(--ink);color:#F3EFE8;border-color:var(--ink)}
.kpi.lead .eyebrow,.kpi.lead .s{color:#A9A194}
.kpi.lead .v{font-size:38px}
.sec{margin-top:26px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h p{font-size:13px;color:var(--ink2)}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;min-height:38px;font-size:13px;font-weight:500;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.scroll-x{overflow-x:auto}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar>b{display:block;height:100%;border-radius:3px;background:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;background:#EFE9DF;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:2px}
.pill.route{background:#FBEBD0;color:#7A520A}
.pill.ok{background:#E1EEDF;color:var(--ok)}
.pill.late{background:#F7DEDB;color:var(--bad)}

/* Voyage list */
.vlist{display:grid;gap:10px}
.vitem{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px;cursor:pointer;transition:transform .12s}
.vitem:active{transform:scale(.99)}
.vitem .route{font:700 16px/1.2 var(--disp);letter-spacing:-.01em}
.vitem .route span{color:var(--ink2);font-weight:500;margin:0 6px}
.vitem .meta{font-size:13px;color:var(--ink2);grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px}
.vitem .amt{text-align:right;font:500 15px/1.2 var(--mono)}
.empty{padding:36px 20px;text-align:center;color:var(--ink2)}
.empty b{display:block;font:700 18px/1.2 var(--disp);color:var(--ink);margin-bottom:6px}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;min-height:46px;margin:14px 0 10px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;transition:transform .1s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}

/* Sheet / form */
.scrim{position:fixed;inset:0;background:rgba(27,25,21,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:94vh;background:var(--paper);border-radius:22px 22px 0 0;transform:translateY(105%);
  transition:transform .42s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:0 -20px 60px -20px rgba(0,0,0,.35)}
.sheet.on{transform:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:10px 18px 12px;border-bottom:1px solid var(--line)}
.grab{width:40px;height:5px;border-radius:3px;background:#CFC6B8;margin:8px auto 2px}
.sheet-h h2{flex:1}
.sheet-b{flex:1;overflow-y:auto;padding:6px 18px 24px;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:10px;padding:12px 18px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.sheet-f .btn{flex:1}
fieldset{border:0;padding:0;margin:20px 0 0}
legend{display:flex;align-items:center;gap:10px;font:700 15px/1.2 var(--disp);letter-spacing:-.01em;margin-bottom:12px;padding:0}
legend .n{font:500 11px/1 var(--mono);background:var(--ink);color:#fff;border-radius:6px;padding:5px 7px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
.fg>*{min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--ink2)}
label.f select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
label.f input,label.f select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;min-height:46px;font-size:16px;color:var(--ink);width:100%;min-width:0;-webkit-appearance:none;appearance:none}
label.f input:focus,label.f select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:52px;padding:6px 4px;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.seg button i{width:14px;height:14px;border-radius:4px}
.seg button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.calc{margin-top:18px;padding:14px;border-radius:12px;background:var(--ink);color:#EFE9DF;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc div{font-size:12px;color:#A9A194}
.calc b{display:block;font:500 17px/1.2 var(--mono);color:#fff;margin-top:3px}
.hint{font-size:12px;color:var(--ink2);margin-top:6px}

/* Prix */
.prices{display:grid;gap:10px;grid-template-columns:1fr}
.prow{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;align-items:end;padding:14px}
.prow .nm{display:flex;align-items:center;gap:10px;font:700 15px/1.2 var(--disp);min-width:96px;align-self:center}
.prow .nm i{width:14px;height:14px;border-radius:4px}
.sim{padding:16px}
.sim-row{display:grid;grid-template-columns:96px 1fr 92px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sim-row:last-child{border-bottom:0}
.sim-row input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.sim-row .o{text-align:right;font:500 14px/1.2 var(--mono)}

.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-120%);z-index:60;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;transition:transform .35s cubic-bezier(.2,.9,.25,1);box-shadow:var(--sh)}
.toast.on{transform:translate(-50%,0)}
.note{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px dashed #D8C9B2;background:#FBF6EC;font-size:13px;color:#6B5A3E}

.steps{display:none}
.clgrid{display:grid;gap:8px;grid-template-columns:1fr}
.cl{padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline}
.cl .t{font:700 15px/1.2 var(--disp)}
.cl .p{font:500 15px/1 var(--mono)}
.cl .bar{grid-column:1/-1;height:8px}
.cl .bar>b{background:var(--accent)}
.cl .bar>b.full{background:var(--ok)}
.cl .s{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.cl .s b{font:500 12px/1 var(--mono);color:var(--ink)}
.cl.total{background:var(--ink);color:#F3EFE8;border-color:var(--ink)}
.cl.total .s{color:#A9A194}.cl.total .s b{color:#fff}
.cl.total .bar{background:rgba(255,255,255,.15)}
.clrow{display:grid;grid-template-columns:1fr 130px 44px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.clrow:last-child{border-bottom:0}
.clrow input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;width:100%;min-width:0}
.clrow button{border:0;background:none;min-height:44px;font-size:20px;color:var(--ink2);cursor:pointer}
@media(min-width:760px){.clgrid{grid-template-columns:repeat(3,1fr)}.cl.total{grid-column:1/-1}}
@media(min-width:1100px){.clgrid{grid-template-columns:repeat(4,1fr)}}
.recent{display:flex;gap:8px;overflow-x:auto;margin:-2px -18px 12px;padding:0 18px 2px;scrollbar-width:none}
.recent:empty{display:none}
.recent button{flex:none;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;min-height:48px;cursor:pointer;line-height:1.25}
.recent button b{display:block;font:500 13px/1.2 var(--mono)}
.recent button span{font-size:12px;color:var(--ink2)}
.recent button:active{transform:scale(.97)}
.mob{display:none}
.mcards{display:grid;gap:8px}
.mc{padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.mc .t{font:700 15px/1.2 var(--disp)}
.mc .big{font:500 16px/1.1 var(--mono);text-align:right}
.mc .row{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--ink2)}
.mc .row b{display:block;font:500 13px/1.2 var(--mono);color:var(--ink);margin-top:2px}
.mc .bar{grid-column:1/-1}
@media(max-width:759px){
  .desk{display:none}.mob{display:grid}
  header.top{padding:10px 16px}
  .brand small{display:none}
  main{padding:0 14px calc(92px + env(safe-area-inset-bottom))}
  .eyebrow[style]{display:none}
  h1{font-size:28px;margin:10px 0 2px}
  .chip{padding:6px 12px;min-height:36px;font-size:13px}
  .filters{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
  .kpis{gap:8px;margin:12px 0}
  .kpi{padding:11px 12px 10px}
  .kpi .v{font-size:20px;margin-top:6px}
  .kpi.lead .v{font-size:30px}
  .kpi .s{font-size:11px}
  .sec{margin-top:20px}
  nav.tabs{left:0;right:0;bottom:0;transform:none;border-radius:0;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 rgba(255,255,255,.06)}
  nav.tabs button{flex:1;min-width:0}
  nav.tabs button.add{flex:none;width:64px}
  .sheet{height:94vh;max-height:none}
  .grab{box-sizing:content-box;width:40px;padding:10px 60px;background-clip:content-box;margin:0 auto;cursor:grab}
  .sheet-h{padding:4px 16px 8px;border-bottom:0}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 16px 4px;padding:4px;background:#E7E0D4;border-radius:12px}
  .steps button{border:0;background:none;border-radius:9px;min-height:40px;font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
  .steps button b{font:500 11px/1 var(--mono);width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:rgba(27,25,21,.1)}
  .steps button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .steps button.done b{background:var(--ok);color:#fff}
  .sheet-b{padding:4px 16px 20px}
  fieldset{display:none;margin-top:10px}
  fieldset.cur{display:block;animation:in .22s cubic-bezier(.2,.8,.2,1)}
  legend{display:none}
  .sheet-f{padding:10px 16px max(12px,env(safe-area-inset-bottom))}
  .vitem{padding:12px}
.kpis .kpi:last-child{grid-column:1/-1}.sheet:not(.on){visibility:hidden;transition:transform .42s,visibility 0s .42s}.fg label:has(input[type=datetime-local]){grid-column:1/-1}}
@media(min-width:760px){
  main{padding:8px 32px 120px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi.lead{grid-column:span 2}
  .two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
  .prices{grid-template-columns:1fr 1fr}
  .sheet{left:50%;right:auto;width:640px;bottom:auto;top:50%;border-radius:22px;max-height:90vh;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.2,.9,.25,1),opacity .2s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .grab{display:none}
  .fg{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1100px){.kpis{grid-template-columns:repeat(6,1fr)}.kpi.lead{grid-column:span 2}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
@media(prefers-reduced-transparency:reduce){header.top{background:var(--paper)}nav.tabs{background:var(--ink)}}
/* ---- v4: filters + i18n ---- */
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.lang button{border:0;background:none;min-width:34px;min-height:30px;border-radius:7px;font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--ink2);cursor:pointer}
.lang button.on{background:var(--ink);color:#fff}
.sync{margin-left:auto}
.fbar{display:grid;gap:8px;margin-top:14px}
.segc{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px;background:#E7E0D4;border-radius:12px}
.segc button{border:0;background:none;border-radius:9px;min-height:38px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.segc button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.frow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
.frow::-webkit-scrollbar{display:none}
.fsel{position:relative;flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:0 30px 0 14px;min-height:38px;font-size:13px;font-weight:500;white-space:nowrap}
.fsel::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg);opacity:.6}
.fsel select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.fsel small{color:var(--ink2);font-weight:400}
.fsel.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fsel.on small{color:#A9A194}
.freset{flex:none;border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;min-height:38px;padding:0 6px;cursor:pointer}
.fcount{font-size:12px;color:var(--ink2);margin-top:2px}
@media(max-width:759px){.sync span{display:none}.sync{padding:9px}.fbar{margin-left:-14px;margin-right:-14px;padding:0 14px}.frow{margin:0 -14px;padding:0 14px}.lang button{min-width:30px}}

/* ---- v5: softer colour grading (malachite + copper) ---- */
:root{
  --paper:#F5F2EC; --card:#FFFFFF; --ink:#22302C; --ink2:#5F6B67; --line:#E3DDD2;
  --brand:#1E6B5A; --brand-2:#2C8571; --brand-t:#E2F0EB; --brand-tt:#F0F7F4;
  --accent:#C2652E; --accent-t:#FBEDE3;
  --ok:#2F7D4F; --warn:#B7801A; --bad:#C0392B;
  --sh:0 1px 2px rgba(34,48,44,.05),0 8px 24px -14px rgba(34,48,44,.22);
}
body{background:linear-gradient(180deg,#F1F5F2 0,var(--paper) 340px)}
header.top{background:rgba(241,245,242,.78)}
.brand .mark{background:var(--brand)}
.lang button.on{background:var(--brand)}
.sync{background:rgba(255,255,255,.7)}
h1{color:var(--ink)}
/* KPI hero: tinted, not black */
.kpi.lead{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);border-color:transparent;color:#fff}
.kpi.lead .eyebrow,.kpi.lead .s{color:rgba(255,255,255,.78)}
.kpi{border-color:#EAE5DC}
/* contracts total */
.cl.total{background:var(--brand-t);color:var(--ink);border-color:#CFE5DC}
.cl.total .s{color:var(--ink2)}.cl.total .s b{color:var(--brand)}
.cl.total .bar{background:#fff}
.cl .bar>b{background:var(--brand-2)}
.cl .bar>b.full{background:var(--ok)}
/* controls */
.segc{background:#E8ECE7}
.segc button.on{color:var(--brand)}
.fsel{border-color:#E1DCD2}
.fsel.on{background:var(--brand-t);border-color:#BFDCD1;color:var(--brand)}
.fsel.on small{color:#4E8676}
.freset{color:var(--accent)}
.chip.on{background:var(--brand);border-color:var(--brand)}
.btn{border-color:#E1DCD2}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);box-shadow:0 6px 16px -8px rgba(194,101,46,.6)}
.search{border-color:#E1DCD2}
label.f input:focus,label.f select:focus{outline-color:var(--brand-2)}
.seg button.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--brand-tt)}
legend .n{background:var(--brand-t);color:var(--brand)}
.steps{background:#E8ECE7!important}
.steps button.on{color:var(--brand)!important}
/* form summary: light tint */
.calc{background:var(--brand-tt);color:var(--ink);border:1px solid #D6E8E0}
.calc div{color:var(--ink2)}
.calc b{color:var(--ink)}
/* pills */
.pill{background:#F0ECE5}
.pill.route{background:#FCF0D9;color:#8A5E0E}
.pill.ok{background:#E2F1E6;color:var(--ok)}
.pill.late{background:#FBE3DF;color:var(--bad)}
/* tab bar: light material (Apple) */
nav.tabs{background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(34,48,44,.08);box-shadow:0 10px 30px -12px rgba(34,48,44,.28)}
nav.tabs button{color:#7A8581}
nav.tabs button.on{background:var(--brand-t);color:var(--brand)}
nav.tabs button.add{background:var(--accent);color:#fff;box-shadow:0 6px 14px -6px rgba(194,101,46,.7)}
.toast{background:var(--ink)}
.sim-row input[type=range]{accent-color:var(--brand-2)}
.note{border-color:#CFE5DC;background:var(--brand-tt);color:var(--brand)}
@media(max-width:759px){nav.tabs{border-width:1px 0 0;border-radius:0;box-shadow:0 -6px 20px -12px rgba(34,48,44,.25)}}
@media(prefers-reduced-transparency:reduce){nav.tabs{background:#fff}header.top{background:var(--paper)}}
@media(prefers-contrast:more){:root{--ink2:#3C4643;--line:#B9B2A6}.fsel,.btn,.kpi,.card{border-color:#9C958A}}
/* ---- v6: alerts, planning, photos, driver mode, report, settings ---- */
.alerts{display:grid;gap:8px;margin-top:14px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;border:1px solid;font-size:13px;cursor:pointer}
.alert svg{width:18px;height:18px}
.alert b{display:block;font-size:14px}
.alert.bad{background:#FBE9E6;border-color:#F1C9C2;color:#8E2A20}
.alert.warn{background:#FCF2DE;border-color:#EFDDB3;color:#7A5410}
.alert.info{background:var(--brand-tt);border-color:#D6E8E0;color:var(--brand)}
.alert .go{font-weight:600;white-space:nowrap}
.badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font:600 10px/16px var(--txt)}
nav.tabs button{position:relative}
.cl .pace{grid-column:1/-1;font-size:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cl .pace span{padding:2px 8px;border-radius:99px;background:#F0ECE5}
.cl .pace span.bad{background:#FBE3DF;color:var(--bad)}
.cl .pace span.ok{background:#E2F1E6;color:var(--ok)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ph{position:relative;border:1.5px dashed #CFC8BC;border-radius:12px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--card);overflow:hidden;cursor:pointer;text-align:center;padding:8px}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.has{border-style:solid;border-color:var(--brand-2)}
.ph .lbl{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);color:var(--ink);padding:3px 8px;border-radius:7px;font-size:11px;z-index:1}
.ph svg{width:22px;height:22px}
.toggle{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;cursor:pointer;font-size:14px;font-weight:500}
.toggle input{width:20px;height:20px;accent-color:var(--brand)}
.vitem .thumbs{grid-column:1/-1;display:flex;gap:6px}
.vitem .thumbs img{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(20,28,26,.88);display:none;align-items:center;justify-content:center;padding:20px}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
/* settings rows */
.srow{display:grid;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.cl4{grid-template-columns:1.3fr 1fr 1fr 1.2fr 40px}
.srow.tr3{grid-template-columns:1.6fr 1fr 40px}
.srow.head{font:500 10.5px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);padding-top:12px}
.srow input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 10px;min-height:44px;font-size:16px;width:100%;min-width:0}
.srow button.x{border:0;background:none;min-height:44px;font-size:20px;color:var(--ink2);cursor:pointer}
.c-f{display:flex;flex-direction:column;gap:3px;min-width:0}.c-f small{display:none;font-size:11px;color:var(--ink2);font-weight:500}
.tbl td.num{white-space:nowrap}
.al-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
/* report */
.rep-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:14px}
.rep-ctl label.f{min-width:160px}
.rep-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
@media(min-width:760px){.rep-sum{grid-template-columns:repeat(4,1fr)}}
/* driver mode */
.drv{max-width:560px;margin:0 auto}
.drv-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 6px}
.drv-big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.drv-big button{border:0;border-radius:18px;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:700 18px/1.1 var(--disp);cursor:pointer;transition:transform .1s}
.drv-big button:active{transform:scale(.97)}
.drv-big svg{width:34px;height:34px}
.drv-big .dep{background:var(--brand);color:#fff}
.drv-big .arr{background:var(--accent);color:#fff}
.drv-big button.on{outline:3px solid var(--ink);outline-offset:2px}
.drv .card{padding:14px}
.drv .fg{grid-template-columns:1fr 1fr}
.drv .bigbtn{width:100%;min-height:56px;font-size:16px;margin-top:14px}
.drv-pick{display:grid;gap:8px}
.drv-pick button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;min-height:60px;cursor:pointer}
.drv-pick button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-t)}
.drv-pick b{display:block;font:500 15px/1.2 var(--mono)}
.drv-pick span{font-size:13px;color:var(--ink2)}
body.driver nav.tabs{display:none}
body.driver main{padding-bottom:40px}
.pending{display:inline-block;margin-left:4px;font-size:11px;font-weight:600;color:var(--warn)}
@media(max-width:759px){.srow.cl4{grid-template-columns:1fr 1fr 40px}.srow.cl4 .c-n{grid-column:1/3}.srow.cl4 .c-x{grid-column:3;grid-row:1}.srow.cl4 .c-f{grid-column:1/3}.c-f small{display:block}.srow.head.cl4{display:none}.srow.cl4 input::placeholder{color:#9AA39F}}
</style>
</head>
<body>
<div class="app">
<header class="top" id="top">
  <div class="brand">
    <div class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F3EFE8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16V6h11v10M14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></div>
    <div><span data-t="app"></span><small data-t="appSub"></small></div>
  </div>
  <div class="sync" id="sync"><i></i><span></span></div>
  <div class="lang" id="lang"><button data-l="fr">FR</button><button data-l="nl">NL</button><button data-l="en">EN</button></div>
</header>

<main>
<!-- ============ DASHBOARD ============ -->
<section class="view active" id="v-tableau">
  <p class="eyebrow" style="margin-top:14px" data-t="eyeDash"></p>
  <h1 data-t="dash"></h1>
  <div class="alerts" id="alerts"></div>
  <div class="fbar" data-fbar></div>
  <div class="grid kpis" id="kpis"></div>
  <div class="sec" id="sec-clients">
    <div class="sec-h"><h2 data-t="clientsH"></h2><p id="cl-sum"></p></div>
    <div class="clgrid" id="clients"></div>
  </div>
  <div class="two">
    <div class="col-route">
      <div class="sec">
        <div class="sec-h"><h2 data-t="enRouteH"></h2><p id="enroute-n"></p></div>
        <div class="vlist" id="enroute"></div>
      </div>
      <div class="sec" id="sec-plan">
        <div class="sec-h"><h2 data-t="planH"></h2><p id="plan-n"></p></div>
        <div class="vlist" id="planned"></div>
      </div>
    </div>
    <div class="col-main">
      <div class="sec">
        <div class="sec-h"><h2 data-t="byTrans"></h2><p data-t="onTimeDef"></p></div>
        <div class="card scroll-x desk"><table class="tbl" id="t-trans"></table></div>
        <div class="mcards mob" id="c-trans"></div>
      </div>
      <div class="sec">
        <div class="sec-h"><h2 data-t="byProd"></h2></div>
        <div class="card scroll-x desk"><table class="tbl" id="t-prod"></table></div>
        <div class="mcards mob" id="c-prod"></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ TRIPS ============ -->
<section class="view" id="v-voyages">
  <p class="eyebrow" style="margin-top:14px" data-t="eyeTrips"></p>
  <h1 data-t="trips"></h1>
  <input class="search" id="q" type="search" data-tp="searchPh">
  <div class="fbar" data-fbar data-status></div>
  <div style="display:flex;gap:8px;margin:12px 0;align-items:center;justify-content:space-between;flex-wrap:wrap">
    <span class="fcount" id="vcount"></span>
    <button class="btn sm" id="csv" data-t="csv"></button>
  </div>
  <div class="vlist" id="vlist"></div>
</section>

<!-- ============ REPORT ============ -->
<section class="view" id="v-rapport">
  <p class="eyebrow" style="margin-top:14px" data-t="eyeRep"></p>
  <h1 data-t="repH"></h1>
  <p class="lede" data-t="repLede"></p>
  <div class="rep-ctl">
    <label class="f"><span data-t="repMonth"></span><input type="month" id="rep-m"></label>
    <label class="f"><span data-t="fCl"></span><select id="rep-c"></select></label>
  </div>
  <div class="rep-sum" id="rep-sum"></div>
  <div class="sec"><div class="sec-h"><h2 data-t="repByCl"></h2></div><div class="card scroll-x"><table class="tbl" id="rep-cl"></table></div></div>
  <div class="sec"><div class="sec-h"><h2 data-t="repByTr"></h2></div><div class="card scroll-x"><table class="tbl" id="rep-tr"></table></div></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
    <button class="btn primary" id="rep-pdf" data-t="repPdf"></button>
    <button class="btn" id="rep-csv" data-t="csv"></button>
  </div>
</section>

<!-- ============ SETTINGS ============ -->
<section class="view" id="v-prix">
  <p class="eyebrow" style="margin-top:14px" data-t="eyePrix"></p>
  <h1 data-t="prixH"></h1>
  <p class="lede" data-t="prixLede"></p>
  <div class="sec">
    <div class="sec-h"><h2 data-t="perTon"></h2></div>
    <div class="prices" id="prices"></div>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:end">
      <label class="f" style="width:140px"><span data-t="currency"></span><input id="cur" maxlength="6"></label>
      <button class="btn dark" id="save-prix" data-t="savePrix"></button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-h"><h2 data-t="clVolH"></h2><p id="cl-tot"></p></div>
    <p class="hint" style="margin:-4px 0 10px" data-t="clHint"></p>
    <div class="card" id="cl-edit"></div>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <button class="btn" id="cl-add" type="button" data-t="clAdd"></button>
      <button class="btn dark" id="cl-save" type="button" data-t="clSave"></button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-h"><h2 data-t="trH"></h2></div>
    <p class="hint" style="margin:-4px 0 10px" data-t="trHint"></p>
    <div class="card" id="tr-edit"></div>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <button class="btn" id="tr-add" type="button" data-t="trAdd"></button>
      <button class="btn dark" id="tr-save" type="button" data-t="trSave"></button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-h"><h2 data-t="alH"></h2></div>
    <div class="card al-grid">
      <label class="f"><span data-t="alLoss"></span><input id="al-loss" type="number" min="0" step="0.1" inputmode="decimal"></label>
      <label class="f"><span data-t="alLate"></span><input id="al-late" type="number" min="0" step="0.5" inputmode="decimal"></label>
      <div class="full" style="grid-column:1/-1"><button class="btn dark" id="al-save" data-t="alSave"></button></div>
    </div>
  </div>
  <div class="sec">
    <div class="sec-h"><h2 data-t="simH"></h2><p data-t="simSub"></p></div>
    <div class="card sim" id="sim"></div>
  </div>
  <div class="sec">
    <div class="sec-h"><h2 data-t="drvH"></h2></div>
    <div class="card" style="padding:16px">
      <p class="lede" style="font-size:14px" data-t="drvLede"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
        <button class="btn primary" id="drv-open" data-t="drvOpen"></button>
      </div>
      <p class="hint" data-t="drvNote"></p>
    </div>
  </div>
</section>

<!-- ============ DRIVER MODE ============ -->
<section class="view" id="v-chauffeur">
  <div class="drv">
    <div class="drv-h"><h1 style="margin:0" data-t="drvH"></h1><button class="btn sm ghost" id="drv-exit" data-t="drvExit"></button></div>
    <div class="drv-big">
      <button class="dep" data-dm="dep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16V6h11v10M14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg><span data-t="drvDep"></span></button>
      <button class="arr" data-dm="arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-t="drvArr"></span></button>
    </div>
    <div id="drv-body"></div>
  </div>
</section>
</main>

<nav class="tabs" id="tabs">
  <button data-v="tableau" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-t="tabDash"></span><i class="badge" id="badge" hidden></i></button>
  <button data-v="voyages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-t="tabTrips"></span></button>
  <button class="add" id="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-t="tabNew"></span></button>
  <button data-v="rapport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg><span data-t="tabRep"></span></button>
  <button data-v="prix"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg><span data-t="tabPrix"></span></button>
</nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
  <div class="grab"></div>
  <div class="sheet-h" id="sheet-h"><h2 id="sheet-t"></h2><button class="btn ghost sm danger" id="del" type="button" hidden data-t="del"></button><button class="btn ghost sm" id="close" data-t="close"></button></div>
  <div class="steps" id="steps"><button type="button" data-st="1" class="on"><b>1</b><span data-t="st1"></span></button><button type="button" data-st="2"><b>2</b><span data-t="st2"></span></button><button type="button" data-st="3"><b>3</b><span data-t="st3"></span></button></div>
  <form class="sheet-b" id="form" autocomplete="off">
    <fieldset data-step="1">
      <legend><span class="n">01</span><span data-t="m1"></span></legend>
      <div class="recent" id="recent"></div>
      <div class="fg">
        <label class="f"><span data-t="fDriver"></span><input name="chauffeur" required list="dl-chauffeur"></label>
        <label class="f"><span data-t="fTel"></span><input name="tel" type="tel" inputmode="tel"></label>
        <label class="f"><span data-t="fTrans"></span><input name="transporteur" required list="dl-trans"></label>
        <label class="f"><span data-t="fPlate"></span><input name="plaque" required style="text-transform:uppercase" list="dl-plaque"></label>
      </div>
    </fieldset>
    <fieldset data-step="2">
      <legend><span class="n">02</span><span data-t="m2"></span></legend>
      <label class="toggle"><input type="checkbox" name="plan" id="f-plan"><span data-t="fPlan"></span></label>
      <label class="f" style="margin-bottom:10px"><span data-t="fClient"></span><select name="client" id="sel-client"></select></label>
      <div class="seg" id="seg-prod"></div>
      <div class="fg" style="margin-top:10px">
        <label class="f"><span data-t="fTDep"></span><input name="tDep" type="number" step="0.01" min="0" inputmode="decimal" required></label>
        <label class="f"><span data-t="fKm"></span><input name="km" type="number" step="0.1" min="0" inputmode="decimal"></label>
        <label class="f"><span data-t="fLDep"></span><input name="lDep" required list="dl-lieu"></label>
        <label class="f"><span data-t="fLArr"></span><input name="lArr" required list="dl-lieu"></label>
        <label class="f"><span data-t="fHDep" id="lbl-hdep"></span><input name="hDep" type="datetime-local" required></label>
        <label class="f"><span data-t="fHPrev"></span><input name="hPrev" type="datetime-local"></label>
        <label class="f" data-noplan><span data-t="fHArr"></span><input name="hArr" type="datetime-local"></label>
        <label class="f" data-noplan><span data-t="fTDech"></span><input name="tDech" type="number" step="0.01" min="0" inputmode="decimal"></label>
      </div>
      <p class="hint" data-t="hintArr" data-noplan></p>
      <div data-noplan>
        <p class="eyebrow" style="margin:16px 0 4px" data-t="photosH"></p>
        <div class="photos" id="f-photos"></div>
      </div>
    </fieldset>
    <fieldset data-step="3">
      <legend><span class="n">03</span><span data-t="m3"></span></legend>
      <div class="fg">

const LSget = k => { try { return localStorage.getItem(k); } catch { return null; } };
const LSset = (k,v) => { try { localStorage.setItem(k,v); return true; } catch { return false; } };

const t = (k, ...a) => { const v = I18N[lang][k] ?? I18N.fr[k] ?? k; return typeof v === 'function' ? v(...a) : v; };
const PRODS = [{k:'charbon', c:'var(--charbon)'},{k:'sable', c:'var(--sable)'},{k:'chips', c:'var(--chips)'},{k:'terre', c:'var(--terre)'}];
const pn = k => I18N[lang].prods[k] || '—';
const PC = Object.fromEntries(PRODS.map(p=>[p.k,p.c]));
const $ = s => document.querySelector(s);
const isMob = () => matchMedia('(max-width:759px)').matches;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const DAY = 864e5;
const ICON = {
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/></svg>',

  trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 18l-9.5-9.5-5 5L1 6"/><path d="M17 18h6v-6"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>'
};

/* ================= state ================= */
let voyages = [], clients = [], clDraft = null, trDraft = null, sim = null;
let config = {cur:'USD', achat:{charbon:0,sable:0,chips:0,terre:0}, marche:{charbon:0,sable:0,chips:0,terre:0}, tarifs:{}, alerts:{loss:2, late:2}};
const F0 = {period:'30', prod:'', client:'', trans:'', status:''};
let state = {view:'tableau', q:'', clAll:false, drv:null, drvPick:null, drvQ:'', ...F0};
let db = null, assets = null, downloads = null, syncKey = 'sConn', syncCls = '';
const photoCache = {};

/* ================= formatting ================= */
const L = () => t('loc');
const fmt = (v, d=0) => isFinite(v) ? v.toLocaleString(L(),{minimumFractionDigits:d,maximumFractionDigits:d}) : '—';
const money = (v, d=0) => isFinite(v) ? fmt(v,d) + ' ' + esc(config.cur||'') : '—';
const pct = v => isFinite(v) ? fmt(v*100,0) + ' %' : '—';
const pct1 = v => isFinite(v) ? fmt(v*100,1) + ' %' : '—';
const dt = s => { if(!s) return '—'; const d = new Date(s); return isNaN(d) ? '—' : d.toLocaleString(L(),{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); };
const nowLocal = (off=0) => { const d=new Date(Date.now()+off); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };

/* ================= business logic ================= */
const clientOf = nm => clients.find(c => c.nom === nm);
function sellPrice(v, marche = config.marche){ return n(v.pVente) || n(clientOf(v.client)?.prix) || n(marche[v.prod]); }
function calc(v, marche = config.marche){
  const achat = n(v.tDep) * n(v.pAchat);
  const fret = n(v.tDep) * n(v.tarifT);
  const frais = fret + n(v.pRoute) + n(v.pMine) + n(v.cRetard);
  const total = achat + frais, km = n(v.km), arrived = !!v.hArr && !v.plan;
  const perte = arrived && v.tDech !== '' && v.tDech != null ? n(v.tDep) - n(v.tDech) : NaN;
  let onTime = null;
  if (arrived) onTime = v.hPrev ? new Date(v.hArr) <= new Date(v.hPrev) : n(v.cRetard) === 0;
  const tLivre = arrived ? n(v.tDech || 0) : 0, revenu = tLivre * sellPrice(v, marche);
  return {achat, fret, frais, total, km, coutKm: km>0 ? total/km : NaN, fraisKm: km>0 ? frais/km : NaN,
    perte, pertePct: n(v.tDep)>0 && isFinite(perte) ? perte/n(v.tDep) : NaN, onTime, arrived, tLivre, revenu, marge: arrived ? revenu - total : NaN};
}
const lateH = () => n(config.alerts?.late ?? 2);
const isLate = v => { if (v.plan) return false; const c = calc(v); return c.onTime === false || (!c.arrived && v.hPrev && Date.now() > new Date(v.hPrev).getTime() + lateH()*36e5); };
const real = () => voyages.filter(v => !v.plan);
function applyFilters(list, {period=true, status=false, keepPlan=false} = {}){
  const days = state.period==='all' ? Infinity : +state.period, lim = Date.now() - days*DAY;
  return list.filter(v => {
    if (state.prod && v.prod !== state.prod) return false;
    if (state.client && (v.client||'') !== state.client) return false;
    if (state.trans && (v.transporteur||'').trim() !== state.trans) return false;
    if (period && days !== Infinity && new Date(v.hDep||v.created).getTime() < lim) return false;
    if (status && state.status) {
      const a = !!v.hArr;
      if (state.status==='plan') return !!v.plan;
      if (v.plan) return false;
      if (state.status==='route' && a) return false;
      if (state.status==='done' && !a) return false;
      if (state.status==='late' && !isLate(v)) return false;
    } else if (!status && !keepPlan && v.plan) return false;
    return true;
  });
}
const activeCount = withStatus => ['prod','client','trans'].filter(k=>state[k]).length + (withStatus && state.status ? 1 : 0) + (state.period!==F0.period ? 1 : 0);
const label = v => [v.plaque && v.plaque.toUpperCase(), v.client || v.lArr].filter(Boolean).join(' · ');

function clientPace(c){
  const del = real().filter(v=>v.client===c.nom && v.hArr);
  const liv = del.reduce((a,v)=>a+n(v.tDech),0);
  const reste = Math.max(0, n(c.obj) - liv);
  const since = Date.now() - 14*DAY;
  const cur = del.filter(v=>new Date(v.hArr).getTime()>=since).reduce((a,v)=>a+n(v.tDech),0) / 14;
  const loads = real().filter(v=>v.client===c.nom).map(v=>n(v.tDep)).filter(x=>x>0);
  const allLoads = real().map(v=>n(v.tDep)).filter(x=>x>0);
  const avgLoad = (loads.length ? loads : allLoads).reduce((a,b)=>a+b,0) / Math.max(1,(loads.length ? loads : allLoads).length) || 30;
  if (!c.fin) return {reste, cur, req:NaN};
  const daysLeft = Math.ceil((new Date(c.fin+'T23:59').getTime() - Date.now())/DAY);
  if (daysLeft <= 0) return {reste, cur, req:NaN, over: reste>0, daysLeft};
  const req = reste / daysLeft;
  return {reste, cur, req, daysLeft, trucks: req/avgLoad};
}

/* ================= alerts ================= */
function computeAlerts(){
  const out = [], lossMax = n(config.alerts?.loss ?? 2)/100;
  const since = Date.now() - 30*DAY;
  real().forEach(v => {
    const c = calc(v);
    if (c.arrived && new Date(v.hArr).getTime() >= since && isFinite(c.pertePct) && c.pertePct > lossMax) out.push({lvl:'bad', ic:'alert', txt:t('aLoss', pct1(c.pertePct), label(v)), id:v.id});
    if (!v.hArr && v.hPrev) { const over = (Date.now() - new Date(v.hPrev).getTime())/36e5; if (over > lateH()) out.push({lvl:'bad', ic:'clock', txt:t('aLate', fmt(over,0), label(v)), id:v.id}); }
  });
  voyages.filter(v=>v.plan && v.hDep && Date.now() > new Date(v.hDep).getTime() + 36e5).forEach(v => out.push({lvl:'warn', ic:'clock', txt:t('aPlan', label(v)), id:v.id}));
  clients.forEach(c => { const p = clientPace(c); if (isFinite(p.req) && p.reste > 0 && p.req > p.cur * 1.05) out.push({lvl:'warn', ic:'trend', txt:t('aPace', c.nom, fmt(p.req,0), fmt(p.cur,0)), client:c.nom}); });
  return out;
}
function renderAlerts(){
  const al = computeAlerts(), b = $('#badge');
  const nBad = al.filter(a=>a.lvl==='bad').length || al.length;
  b.hidden = !al.length; b.textContent = al.length > 9 ? '9+' : al.length;
  const shown = al.slice(0,4);
  $('#alerts').innerHTML = shown.map((a,i)=>`<div class="alert ${a.lvl}" data-al="${i}" role="button" tabindex="0">${ICON[a.ic]}<div>${esc(a.txt)}</div><span class="go">${t('aOpen')} ›</span></div>`).join('') +
    (al.length > 4 ? `<div class="fcount" style="padding-left:4px">${t('aMore', al.length-4)}</div>` : '');
  $('#alerts').onclick = e => { const el = e.target.closest('[data-al]'); if (!el) return; const a = shown[+el.dataset.al];
    if (a.id) { const v = voyages.find(x=>x.id===a.id); if (v) openSheet(v, 2); } else if (a.client) { state.client = a.client; render(); $('#sec-clients').scrollIntoView({behavior:'smooth'}); } };
  return nBad;
}

/* ================= filter bar ================= */
function fselect(key, lab, opts){
  const cur = state[key], curLabel = opts.find(o=>o[0]===cur)?.[1];
  return `<label class="fsel ${cur?'on':''}"><small>${lab}</small>${cur ? esc(curLabel) : esc(t('all'))}
    <select data-f="${key}" aria-label="${esc(lab)}"><option value="">${esc(t('all'))}</option>${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
}
function renderFilterBars(){
  const trans = [...new Set(voyages.map(v=>(v.transporteur||'').trim()).filter(Boolean))].sort();
  const cls = [...new Set([...clients.map(c=>c.nom), ...voyages.map(v=>v.client).filter(Boolean)])].sort();
  document.querySelectorAll('[data-fbar]').forEach(el => {
    const withStatus = el.hasAttribute('data-status');

    el.innerHTML = `<div class="segc" role="group">${periods.map(([k,l])=>`<button type="button" data-pp="${k}" class="${state.period===k?'on':''}" aria-pressed="${state.period===k}">${l}</button>`).join('')}</div>

        ${fselect('client', t('fCl'), cls.map(c=>[c,c]))}
        ${fselect('prod', t('fProd'), PRODS.map(p=>[p.k, pn(p.k)]))}
        ${trans.length ? fselect('trans', t('fTr'), trans.map(x=>[x,x])) : ''}
        ${activeCount(withStatus) ? `<button type="button" class="freset" data-freset>${t('reset')}</button>` : ''}
      </div>`;
  });
}
document.addEventListener('change', e => { const k = e.target.dataset?.f; if (k) { state[k] = e.target.value; render(); } });
document.addEventListener('click', e => {
  const p = e.target.closest('[data-pp]'); if (p) { state.period = p.dataset.pp; render(); return; }
  if (e.target.closest('[data-freset]')) { Object.assign(state, F0); render(); }

/* ================= dashboard ================= */
const col = r => r>=.85?'var(--ok)':r>=.6?'var(--warn)':isFinite(r)?'var(--bad)':'inherit';
const bar = r => `<div class="bar"><b style="width:${isFinite(r)?Math.min(1,r)*100:0}%;background:${col(r)}"></b></div>`;
const pill = k => `<span class="pill"><i style="background:${PC[k]}"></i>${esc(pn(k))}</span>`;
function groupStats(rows, keyFn){
  const g = {}, sum = (a,f) => a.reduce((s,r)=>s+f(r),0);
  rows.forEach(r => { const k = keyFn(r.v) || '—'; (g[k] ||= []).push(r); });
  return Object.entries(g).map(([k,a]) => {
    const tt = a.filter(r=>r.c.onTime!==null), ok = tt.filter(r=>r.c.onTime).length, km = sum(a,r=>r.c.km);
    const d = a.filter(r=>r.c.arrived), td = sum(d,r=>n(r.v.tDep)), tch = sum(d,r=>n(r.v.tDech));
    return {k, n:a.length, rate: tt.length? ok/tt.length : NaN, ck: km? sum(a,r=>r.c.total)/km : NaN, fk: km? sum(a,r=>r.c.frais)/km : NaN,
      perte: td? (td-tch)/td : NaN, liv: tch, cost: sum(a,r=>r.c.total), rev: sum(d,r=>r.c.revenu), marge: sum(d,r=>r.c.marge||0), hasD: d.length};
  });
}
function renderDash(){
  renderAlerts();

    <div class="card kpi"><div class="eyebrow">${t('kOnTime')}</div><div class="v num" style="color:${col(onTime)}">${pct(onTime)}</div><div class="s">${t('ofTrips', okN, timed.length)}</div></div>

    <div class="card kpi"><div class="eyebrow">${t('kTon')}</div><div class="v num">${fmt(tDech,1)} t</div><div class="s">${t('ofLoaded', fmt(tDep,1)+' t')}</div></div>
    <div class="card kpi"><div class="eyebrow">${t('kLoss')}</div><div class="v num" style="color:${tDep && (tDep-tDech)/tDep>lossMax?'var(--bad)':'inherit'}">${tDep? fmt(tDep-tDech,1)+' t':'—'}</div><div class="s">${t('ofLoad', tDep? pct1((tDep-tDech)/tDep):'—')}</div></div>
    <div class="card kpi"><div class="eyebrow">${t('kMarge')}</div><div class="v num" style="color:${marge<0?'var(--bad)':'inherit'}">${done.length? money(marge):'—'}</div><div class="s">${t('atMarket')}</div></div>`;
  renderClients();

  $('#t-trans').innerHTML = tr.length ? `<thead><tr><th>${t('thTrans')}</th><th class="r">${t('thTrips')}</th><th>${t('thOnTime')}</th><th class="r">${t('thCostKm')}</th><th class="r">${t('thFeesKm')}</th><th class="r">${t('thLoss')}</th></tr></thead><tbody>` +
    tr.map(x=>`<tr><td><b>${esc(x.k)}</b></td><td class="r num">${x.n}</td><td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1">${bar(x.rate)}</div><span class="num" style="font-size:13px">${pct(x.rate)}</span></div></td><td class="r num">${money(x.ck,2)}</td><td class="r num">${money(x.fk,2)}</td><td class="r num" style="color:${x.perte>lossMax?'var(--bad)':'inherit'}">${pct1(x.perte)}</td></tr>`).join('') + '</tbody>'
    : `<tbody><tr><td class="empty">${t('noData')}</td></tr></tbody>`;
  $('#c-trans').innerHTML = tr.length ? tr.map(x=>`<div class="card mc"><div class="t">${esc(x.k)}</div><div class="big" style="color:${col(x.rate)}">${pct(x.rate)}</div>${bar(x.rate)}
    <div class="row"><span>${t('thTrips')}<b>${x.n}</b></span><span>${t('thCostKm')}<b>${money(x.ck,2)}</b></span><span>${t('thLoss')}<b style="color:${x.perte>lossMax?'var(--bad)':'inherit'}">${pct1(x.perte)}</b></span></div></div>`).join('')
    : `<div class="card empty">${t('noData')}</div>`;

  const pr = PRODS.map(p => { const a = rows.filter(r=>r.v.prod===p.k), d = a.filter(r=>r.c.arrived);
    return {p, n:a.length, t: sum(d,r=>n(r.v.tDech)), achat: sum(a,r=>r.c.achat), frais: sum(a,r=>r.c.frais), marge: sum(d,r=>r.c.marge||0), hasD:d.length}; }).filter(x=>x.n);

    pr.map(x=>`<tr><td>${pill(x.p.k)}</td><td class="r num">${fmt(x.t,1)} t</td><td class="r num">${money(x.achat)}</td><td class="r num">${money(x.frais)}</td><td class="r num" style="color:${x.marge<0?'var(--bad)':'inherit'}">${x.hasD?money(x.marge):'—'}</td></tr>`).join('') + '</tbody>'
    : `<tbody><tr><td class="empty">${t('noData')}</td></tr></tbody>`;
  $('#c-prod').innerHTML = pr.length ? pr.map(x=>`<div class="card mc"><div class="t">${pill(x.p.k)}</div><div class="big" style="color:${x.marge<0?'var(--bad)':'inherit'}">${x.hasD?money(x.marge):'—'}</div>
    <div class="row"><span>${t('thDel')}<b>${fmt(x.t,1)} t</b></span><span>${t('thBuy')}<b>${money(x.achat)}</b></span><span>${t('thFees')}<b>${money(x.frais)}</b></span></div></div>`).join('') : `<div class="card empty">${t('noData')}</div>`;

  const er = applyFilters(real().filter(v=>!v.hArr), {period:false}).sort((a,b)=>new Date(a.hDep)-new Date(b.hDep));

      <div style="grid-column:1/-1;display:flex;gap:8px;margin-top:4px">
        ${v.tel?`<a class="btn sm" href="tel:${esc(v.tel)}">${esc(v.tel)}</a>`:''}
        <button class="btn sm dark" data-arrive="${esc(v.id)}">${t('markArr')}</button>
      </div></div>`).join('') : `<div class="card empty"><b>${t('noTruck')}</b>${t('noTruckTxt')}</div>`;

  const pl = applyFilters(voyages.filter(v=>v.plan), {period:false, keepPlan:true}).sort((a,b)=>new Date(a.hDep)-new Date(b.hDep));
  $('#plan-n').textContent = pl.length ? t('trucks', pl.length) : '';
  $('#planned').innerHTML = pl.length ? pl.map(v => { const due = v.hDep && Date.now() > new Date(v.hDep).getTime() + 36e5;
    return `<div class="card vitem" data-id="${esc(v.id)}">

function repData(){
  const m = $('#rep-m').value || new Date().toISOString().slice(0,7), cl = $('#rep-c').value;
  const [y, mo] = m.split('-').map(Number), from = new Date(y, mo-1, 1).getTime(), to = new Date(y, mo, 1).getTime();
  const list = real().filter(v => v.hArr && (!cl || v.client===cl)).filter(v => { const x = new Date(v.hArr).getTime(); return x>=from && x<to; });
  const rows = list.map(v => ({v, c:calc(v)}));
  const sum = f => rows.reduce((s,r)=>s+f(r),0);
  const timed = rows.filter(r=>r.c.onTime!==null);
  const tot = {n:rows.length, dep:sum(r=>n(r.v.tDep)), liv:sum(r=>n(r.v.tDech)), cost:sum(r=>r.c.total), rev:sum(r=>r.c.revenu), km:sum(r=>r.c.km), on: timed.length ? timed.filter(r=>r.c.onTime).length/timed.length : NaN};
  tot.marge = tot.rev - tot.cost; tot.perte = tot.dep ? (tot.dep-tot.liv)/tot.dep : NaN;
  const monthLabel = new Date(y, mo-1, 1).toLocaleDateString(L(), {month:'long', year:'numeric'});
  return {m, cl, rows, list, tot, byCl: groupStats(rows, v=>v.client||'—').sort((a,b)=>b.liv-a.liv), byTr: groupStats(rows, v=>(v.transporteur||'').trim()).sort((a,b)=>b.liv-a.liv), monthLabel};

async function compress(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let max = 1100, q = 0.62, out;
    for (let k=0; k<4; k++) {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      out = c.toDataURL('image/jpeg', q);
      if (out.length < 190000) break;
      max *= 0.8; q -= 0.08;
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}
const dataUrlToBlob = d => { const [h, b] = d.split(','); const bin = atob(b), arr = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr], {type: h.match(/:(.*?);/)[1]}); };
async function storePhoto(dataUrl){
  if (assets) { try { const r = await assets.upload(dataUrlToBlob(dataUrl), {type:'image/jpeg'}); return 'a:' + r.id; } catch (e) { if (e?.code === 'store_unavailable' || e?.code === 'upstream_error') throw {code:'unavailable'}; } }
  if (db) { const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); await withTimeout(db.doc('photos/'+id).set({d:dataUrl, at:new Date().toISOString()})); photoCache[id] = dataUrl; return 'p:' + id; }
  return 'd:' + dataUrl;
}
let formPhotos = {};   // kind -> dataUrl (new, unsaved)
function renderFormPhotos(target = '#f-photos', kinds = ['load','unload'], v = null){
  const el = $(target); if (!el) return;
  const cur = v || voyages.find(x=>x.id===editing);
  el.innerHTML = kinds.map(k => { const src = formPhotos[k] || (cur && photoOf(cur, k));
    return `<label class="ph ${src?'has':''}">${src?`<img src="${esc(src)}" alt="">`:ICON.cam+`<span>${t('phAdd')}</span>`}<span class="lbl">${t(k==='load'?'phLoad':'phUnload')}</span><input type="file" accept="image/*" capture="environment" data-ph="${k}"></label>`; }).join('');
}
document.addEventListener('change', async e => {
  const k = e.target.dataset?.ph; if (!k || !e.target.files?.[0]) return;

});
async function attachPhotos(id, photosIn){
  const photos = {...(photosIn||{})};
  for (const [k, d] of Object.entries(formPhotos)) {
    if (!navigator.onLine) { queue({type:'photo', vid:id, kind:k, dataUrl:d}); continue; }
    try { photos[k] = await storePhoto(d); } catch { queue({type:'photo', vid:id, kind:k, dataUrl:d}); }
  }
  formPhotos = {};
  return photos;
}

    : `<div class="card empty">${t('drvNone')}</div>`;
  $('#drv-pick').onclick = e => { const b = e.target.closest('[data-dp]'); if (!b) return; state.drvPick = b.dataset.dp; formPhotos = {}; renderDrvPick(); };
  const v = voyages.find(x=>x.id===state.drvPick && !x.hArr);
  const box = $('#drv-arr');
  if (!v) { box.innerHTML = ''; return; }
  if (box.dataset.vid === v.id) return;
  box.dataset.vid = v.id;
  box.innerHTML = `<form class="card" id="drv-aform" style="margin-top:12px"><div class="fg">
      <label class="f" style="grid-column:1/-1"><span>${t('fTDech')}</span><input name="tDech" type="number" step="0.01" min="0" inputmode="decimal" required value="${esc(v.tDep)}"></label></div>
      <p class="eyebrow" style="margin:14px 0 4px">${t('photosH')}</p><div class="photos" id="drv-photos" style="grid-template-columns:1fr"></div>
      <button class="btn primary bigbtn" type="submit">${t('drvSaveArr')}</button></form>`;
  renderDriverPhotos();
  $('#drv-aform').onsubmit = async e => { e.preventDefault(); const f = e.target; if (!f.reportValidity()) return;
    f.querySelector('[type=submit]').disabled = true;
    try { const photos = await attachPhotos(v.id, v.photos); const r = await saveTrip({...v, photos, hArr: nowLocal(), tDech: f.tDech.value, updated:new Date().toISOString()});
      if (r !== 'queued') toast(t('drvDoneArr')); state.drvPick = null; state.drv = null; $('#drv-body').dataset.mode=''; renderDriver(); }
    catch (err) { toast(errMsg(err)); f.querySelector('[type=submit]').disabled = false; } };
}
document.querySelectorAll('[data-dm]').forEach(b => b.addEventListener('click', () => { state.drv = state.drv===b.dataset.dm ? null : b.dataset.dm; state.drvPick = null; $('#drv-body').dataset.mode=''; renderDriver(); }));

/* ================= csv ================= */
async function copyCsv(list){
  const rows = list.map(v => { const c = calc(v); return [v.client,v.chauffeur,v.tel,v.transporteur,v.plaque,pn(v.prod),v.tDep,v.lDep,v.hDep,v.lArr,v.hPrev,v.hArr,v.km,v.tDech,v.pAchat,v.tarifT,v.pRoute,v.pMine,v.cRetard,sellPrice(v)||'',v.motif,c.total.toFixed(2),c.arrived?c.revenu.toFixed(2):'',c.arrived?c.marge.toFixed(2):'',isFinite(c.coutKm)?c.coutKm.toFixed(2):'',isFinite(c.perte)?c.perte.toFixed(2):'',c.onTime===null?'':c.onTime?t('yes'):t('no')]; });
  const csv = [t('csvH'),...rows].map(r=>r.map(x=>{const s=String(x??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(';')).join('\n');
  try { await navigator.clipboard.writeText(csv); toast(t('tCopied', list.length)); } catch { toast(t('tCopyNo')); }
}
$('#csv').onclick = () => copyCsv(applyFilters(voyages, {status:true}));

/* ================= toast / sync ================= */
let tt; function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2600); }
function errMsg(e){ if(e?.code==='quota_exceeded') return t('eQuota'); if(e?.code==='invalid_argument') return t('eRights'); return t('eGen'); }
function setSync(cls, key){ syncCls = cls; syncKey = key; updateSync(); }
function updateSync(){ const s=$('#sync'); s.className='sync '+syncCls; s.querySelector('span').innerHTML = esc(t(syncKey)) + (outbox.length ? ` <b class="pending">· ${esc(t('pend', outbox.length))}</b>` : ''); s.title = s.textContent; if (outbox.length && isMob()) s.style.background = '#FCF2DE'; else s.style.background = ''; }

/* ================= storage: db + offline outbox + local cache ================= */
const LS = 'registre-transport-v1', OB = 'registre-outbox-v1', CACHE = 'registre-cache-v1';
let outbox = []; try { outbox = JSON.parse(LSget(OB) || '[]'); } catch { outbox = []; }
const saveOutbox = () => { LSset(OB, JSON.stringify(outbox)); updateSync(); };
function queue(item){
  if (item.path) outbox = outbox.filter(o => !(o.path === item.path && o.type !== 'photo'));
  outbox.push({...item, q: Date.now()});
  if (!LSset(OB, JSON.stringify(outbox))) { // storage full: drop photo payloads first
    outbox = outbox.filter(o => o.type !== 'photo'); LSset(OB, JSON.stringify(outbox));
  }
  updateSync();
}
const withTimeout = (p, ms=7000) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), ms))]);
const transient = e => !e || ['unavailable','timeout','resource_exhausted'].includes(e.code);
function applyLocal(op){
  if (op.type==='set' && op.path.startsWith('voyages/')) { const i = voyages.findIndex(v=>v.id===op.data.id); i>=0 ? voyages[i]=op.data : voyages.push(op.data); }
  if (op.type==='del' && op.path.startsWith('voyages/')) voyages = voyages.filter(v=>'voyages/'+v.id !== op.path);
  if (op.type==='set' && op.path==='config/clients') clients = op.data.list;
  if (op.type==='set' && op.path==='config/prix') config = {...config, ...op.data};
}
async function dbWrite(op){
  if (!db) { applyLocal(op); localPersist(); render(); return 'ok'; }
  applyLocal(op); render();
  if (!navigator.onLine) { queue(op); return 'queued'; }
  try { await withTimeout(op.type==='del' ? db.doc(op.path).delete() : db.doc(op.path).set(op.data)); return 'ok'; }
  catch (e) { if (transient(e)) { queue(op); return 'queued'; } throw e; }
}
let flushing = false;
async function flush(){
  if (!db || flushing || !outbox.length || !navigator.onLine) return;
  flushing = true;
  try {
    for (const op of [...outbox]) {
      try {
        if (op.type === 'photo') {
          const ref = await storePhoto(op.dataUrl);
          const v = voyages.find(x=>x.id===op.vid);
          if (v) { const nv = {...v, photos:{...(v.photos||{}), [op.kind]: ref}}; await withTimeout(db.doc('voyages/'+v.id).set(nv)); }
        } else if (op.type === 'del') await withTimeout(db.doc(op.path).delete());
        else await withTimeout(db.doc(op.path).set(op.data));
        outbox = outbox.filter(o => o !== op && !(o.q===op.q && o.path===op.path && o.vid===op.vid)); saveOutbox();
      } catch (e) { if (transient(e)) break; outbox = outbox.filter(o => o !== op); saveOutbox(); }
    }
  } finally { flushing = false; render(); }
}
window.addEventListener('online', () => { setSync('on','sOk'); flush(); });
window.addEventListener('offline', () => setSync('off','sOff'));
setInterval(flush, 20000);
function overlayOutbox(){ outbox.forEach(op => { if (op.type!=='photo') applyLocal(op); }); }
let cacheT; function cacheSave(){ if (!db) return; clearTimeout(cacheT); cacheT = setTimeout(() => LSset(CACHE, JSON.stringify({voyages, clients, config})), 800); }
function cacheLoad(){ try { const o = JSON.parse(LSget(CACHE) || 'null'); if (o) { voyages = o.voyages||[]; clients = o.clients||[]; config = {...config, ...o.config}; } } catch {} }
function localPersist(){ LSset(LS, JSON.stringify({voyages, config, clients})); }
const store = {
  saveVoyage: d => dbWrite({type:'set', path:'voyages/'+d.id, data:d}),
  deleteVoyage: id => dbWrite({type:'del', path:'voyages/'+id}),
  saveClients: list => dbWrite({type:'set', path:'config/clients', data:{list}}),
  saveConfig: c => dbWrite({type:'set', path:'config/prix', data:c})
};
function normConfig(d){ return {cur:d.cur||'USD', achat:{...config.achat,...(d.achat||{})}, marche:{...config.marche,...(d.marche||{})}, tarifs:{...(d.tarifs||{})}, alerts:{loss:2, late:2, ...(d.alerts||{})}}; }
async function init(){
  cacheLoad(); applyStatic(); render();
  let cl = null;
  try { cl = window.claude && await window.claude.use('db'); } catch { cl = null; }
  try { downloads = window.claude ? await window.claude.use('downloads') : null; } catch { downloads = null; }
  if (!cl) {
    db = null; try { const o = JSON.parse(LSget(LS)||'{}'); voyages = o.voyages||[]; clients = o.clients||[]; if(o.config) config = normConfig(o.config); } catch {}
    setSync('off','sLocal'); render(); return;
  }
  db = cl;
  try { assets = await window.claude.use('assets'); } catch { assets = null; }
  let loaded = false;
  const timer = setTimeout(() => { if(!loaded) setSync('', navigator.onLine ? 'sSlow' : 'sOff'); }, 10000);
  db.collection('voyages').onSnapshot(snap => {
    voyages = snap.docs.map(d => ({...d.data(), id:d.id})); overlayOutbox();
    if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); setSync('on','sOk'); flush(); }
    render();
  }, err => { clearTimeout(timer); setSync('off', err.code==='revoked'?'sRevoked':'sOff'); });
  db.doc('config/clients').onSnapshot(s => {
    clients = s.exists && Array.isArray(s.data().list) ? s.data().list.map(c=>({nom:String(c.nom||''), obj:n(c.obj), prix:n(c.prix), fin:String(c.fin||'')})).filter(c=>c.nom) : [];
    render();
  }, () => {});
  db.doc('config/prix').onSnapshot(s => { if (s.exists) { config = normConfig(s.data()); sim = {...config.marche}; } render(); }, () => {});
  try { const u = await window.claude.use('user'); const w = u && await u.can?.('data.write'); if (w === false) ['#add','#save-prix','#cl-save','#cl-add','#tr-save','#tr-add','#al-save'].forEach(s=>$(s).hidden=true); } catch {}
}
let h0 = location.hash.slice(1);
if (LSget('registre-driver') === '1' && h0 !== 'tableau' && h0 !== 'prix') h0 = 'chauffeur';
if (VIEWS.includes(h0) && h0 !== 'tableau') { state.view = h0; document.body.classList.toggle('driver', h0==='chauffeur'); document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id==='v-'+h0)); document.querySelectorAll('#tabs button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v===h0)); }
init();
})();
</script>
