<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#141C1B">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registre de Transport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EFE8; --card:#FFFDF9; --ink:#1B1915; --ink2:#5A544B; --line:#E2DBCF;
  --accent:#B4441F; --accent-ink:#fff; --ok:#2F6B3F; --warn:#B07A12; --bad:#B3261E;
  --charbon:#2A2A2A; --sable:#C9973A; --chips:#6E7F8F; --terre:#A63D23;
  --r:14px; --sh:0 1px 0 rgba(27,25,21,.04),0 6px 24px -12px rgba(27,25,21,.18);
  --disp:'Archivo',system-ui,sans-serif; --txt:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font:400 15px/1.5 var(--txt);color:var(--ink);background:var(--paper);min-height:100vh}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* Layout */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
body{overflow-x:hidden}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 18px;
  background:rgba(243,239,232,.82);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid transparent}
header.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:800 17px/1 var(--disp);letter-spacing:-.02em;text-transform:uppercase}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.brand small{display:block;font:500 11px/1.2 var(--txt);letter-spacing:.04em;color:var(--ink2);text-transform:none;margin-top:3px}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.sync.on i{background:var(--ok)} .sync.off i{background:var(--bad)}
main{padding:8px 18px 120px;max-width:1180px;width:100%;margin:0 auto}
.view{display:none} .view.active{display:block;animation:in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h1{font:800 clamp(28px,6vw,44px)/1.02 var(--disp);letter-spacing:-.03em;margin:14px 0 4px}
h2{font:700 19px/1.2 var(--disp);letter-spacing:-.015em}
.lede{color:var(--ink2);max-width:60ch}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

/* Tab bar */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:30;display:flex;gap:4px;padding:6px;
  background:rgba(27,25,21,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;box-shadow:0 10px 40px -10px rgba(0,0,0,.45)}
nav.tabs button{border:0;background:none;color:#CFC8BC;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:68px;min-height:48px;padding:6px 10px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button.on{background:rgba(255,255,255,.12);color:#fff}
nav.tabs button.add{background:var(--accent);color:#fff}
@media(min-width:760px){.col-route{order:2}}
@media(min-width:1024px){#next{display:none}}
nav.tabs button:active{transform:scale(.96)}

/* Cards / KPI */
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr));margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.kpi{padding:14px 14px 12px}
.kpi .v{font:500 24px/1.1 var(--mono);letter-spacing:-.03em;margin-top:8px}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:4px}
.kpi.lead{grid-column:1/-1;background:var(--ink);color:#F3EFE8;border-color:var(--ink)}
.kpi.lead .eyebrow,.kpi.lead .s{color:#A9A194}
.kpi.lead .v{font-size:38px}
.sec{margin-top:26px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h p{font-size:13px;color:var(--ink2)}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;min-height:38px;font-size:13px;font-weight:500;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.scroll-x{overflow-x:auto}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar>b{display:block;height:100%;border-radius:3px;background:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;background:#EFE9DF;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:2px}
.pill.route{background:#FBEBD0;color:#7A520A}
.pill.ok{background:#E1EEDF;color:var(--ok)}
.pill.late{background:#F7DEDB;color:var(--bad)}

/* Voyage list */
.vlist{display:grid;gap:10px}
.vitem{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px;cursor:pointer;transition:transform .12s}
.vitem:active{transform:scale(.99)}
.vitem .route{font:700 16px/1.2 var(--disp);letter-spacing:-.01em}
.vitem .route span{color:var(--ink2);font-weight:500;margin:0 6px}
.vitem .meta{font-size:13px;color:var(--ink2);grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px}
.vitem .amt{text-align:right;font:500 15px/1.2 var(--mono)}
.empty{padding:36px 20px;text-align:center;color:var(--ink2)}
.empty b{display:block;font:700 18px/1.2 var(--disp);color:var(--ink);margin-bottom:6px}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;min-height:46px;margin:14px 0 10px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;transition:transform .1s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}

/* Sheet / form */
.scrim{position:fixed;inset:0;background:rgba(27,25,21,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:94vh;background:var(--paper);border-radius:22px 22px 0 0;transform:translateY(105%);
  transition:transform .42s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:0 -20px 60px -20px rgba(0,0,0,.35)}
.sheet.on{transform:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:10px 18px 12px;border-bottom:1px solid var(--line)}
.grab{width:40px;height:5px;border-radius:3px;background:#CFC6B8;margin:8px auto 2px}
.sheet-h h2{flex:1}
.sheet-b{flex:1;overflow-y:auto;padding:6px 18px 24px;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:10px;padding:12px 18px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.sheet-f .btn{flex:1}
fieldset{border:0;padding:0;margin:20px 0 0}
legend{display:flex;align-items:center;gap:10px;font:700 15px/1.2 var(--disp);letter-spacing:-.01em;margin-bottom:12px;padding:0}
legend .n{font:500 11px/1 var(--mono);background:var(--ink);color:#fff;border-radius:6px;padding:5px 7px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
.fg>*{min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--ink2)}
label.f select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
label.f input,label.f select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;min-height:46px;font-size:16px;color:var(--ink);width:100%;min-width:0;-webkit-appearance:none;appearance:none}
label.f input:focus,label.f select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:52px;padding:6px 4px;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.seg button i{width:14px;height:14px;border-radius:4px}
.seg button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.calc{margin-top:18px;padding:14px;border-radius:12px;background:var(--ink);color:#EFE9DF;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc div{font-size:12px;color:#A9A194}
.calc b{display:block;font:500 17px/1.2 var(--mono);color:#fff;margin-top:3px}
.hint{font-size:12px;color:var(--ink2);margin-top:6px}

/* Prix */
.prices{display:grid;gap:10px;grid-template-columns:1fr}
.prow{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;align-items:end;padding:14px}
.prow .nm{display:flex;align-items:center;gap:10px;font:700 15px/1.2 var(--disp);min-width:96px;align-self:center}
.prow .nm i{width:14px;height:14px;border-radius:4px}
.sim{padding:16px}
.sim-row{display:grid;grid-template-columns:96px 1fr 92px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sim-row:last-child{border-bottom:0}
.sim-row input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.sim-row .o{text-align:right;font:500 14px/1.2 var(--mono)}

.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-120%);z-index:60;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;transition:transform .35s cubic-bezier(.2,.9,.25,1);box-shadow:var(--sh)}
.toast.on{transform:translate(-50%,0)}
.note{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px dashed #D8C9B2;background:#FBF6EC;font-size:13px;color:#6B5A3E}

.steps{display:none}
.clgrid{display:grid;gap:8px;grid-template-columns:1fr}
.cl{padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline}
.cl .t{font:700 15px/1.2 var(--disp)}
.cl .p{font:500 15px/1 var(--mono)}
.cl .bar{grid-column:1/-1;height:8px}
.cl .bar>b{background:var(--accent)}
.cl .bar>b.full{background:var(--ok)}
.cl .s{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.cl .s b{font:500 12px/1 var(--mono);color:var(--ink)}
.cl.total{background:var(--ink);color:#F3EFE8;border-color:var(--ink)}
.cl.total .s{color:#A9A194}.cl.total .s b{color:#fff}
.cl.total .bar{background:rgba(255,255,255,.15)}
.clrow{display:grid;grid-template-columns:1fr 130px 44px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.clrow:last-child{border-bottom:0}
.clrow input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;width:100%;min-width:0}
.clrow button{border:0;background:none;min-height:44px;font-size:20px;color:var(--ink2);cursor:pointer}
@media(min-width:760px){.clgrid{grid-template-columns:repeat(3,1fr)}.cl.total{grid-column:1/-1}}
@media(min-width:1100px){.clgrid{grid-template-columns:repeat(4,1fr)}}
.recent{display:flex;gap:8px;overflow-x:auto;margin:-2px -18px 12px;padding:0 18px 2px;scrollbar-width:none}
.recent:empty{display:none}
.recent button{flex:none;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;min-height:48px;cursor:pointer;line-height:1.25}
.recent button b{display:block;font:500 13px/1.2 var(--mono)}
.recent button span{font-size:12px;color:var(--ink2)}
.recent button:active{transform:scale(.97)}
.mob{display:none}
.mcards{display:grid;gap:8px}
.mc{padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.mc .t{font:700 15px/1.2 var(--disp)}
.mc .big{font:500 16px/1.1 var(--mono);text-align:right}
.mc .row{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--ink2)}
.mc .row b{display:block;font:500 13px/1.2 var(--mono);color:var(--ink);margin-top:2px}
.mc .bar{grid-column:1/-1}
@media(max-width:759px){
  .desk{display:none}.mob{display:grid}
  header.top{padding:10px 16px}
  .brand small{display:none}
  main{padding:0 14px calc(92px + env(safe-area-inset-bottom))}
  .eyebrow[style]{display:none}
  h1{font-size:28px;margin:10px 0 2px}
  .chip{padding:6px 12px;min-height:36px;font-size:13px}
  .filters{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
  .kpis{gap:8px;margin:12px 0}
  .kpi{padding:11px 12px 10px}
  .kpi .v{font-size:20px;margin-top:6px}
  .kpi.lead .v{font-size:30px}
  .kpi .s{font-size:11px}
  .sec{margin-top:20px}
  nav.tabs{left:0;right:0;bottom:0;transform:none;border-radius:0;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 rgba(255,255,255,.06)}
  nav.tabs button{flex:1;min-width:0}
  nav.tabs button.add{flex:none;width:64px}
  .sheet{height:94vh;max-height:none}
  .grab{box-sizing:content-box;width:40px;padding:10px 60px;background-clip:content-box;margin:0 auto;cursor:grab}
  .sheet-h{padding:4px 16px 8px;border-bottom:0}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 16px 4px;padding:4px;background:#E7E0D4;border-radius:12px}
  .steps button{border:0;background:none;border-radius:9px;min-height:40px;font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
  .steps button b{font:500 11px/1 var(--mono);width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:rgba(27,25,21,.1)}
  .steps button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .steps button.done b{background:var(--ok);color:#fff}
  .sheet-b{padding:4px 16px 20px}
  fieldset{display:none;margin-top:10px}
  fieldset.cur{display:block;animation:in .22s cubic-bezier(.2,.8,.2,1)}
  legend{display:none}
  .sheet-f{padding:10px 16px max(12px,env(safe-area-inset-bottom))}
  .vitem{padding:12px}
.kpis .kpi:last-child{grid-column:1/-1}.sheet:not(.on){visibility:hidden;transition:transform .42s,visibility 0s .42s}.fg label:has(input[type=datetime-local]){grid-column:1/-1}}
@media(min-width:760px){
  main{padding:8px 32px 120px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi.lead{grid-column:span 2}
  .two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
  .prices{grid-template-columns:1fr 1fr}
  .sheet{left:50%;right:auto;width:640px;bottom:auto;top:50%;border-radius:22px;max-height:90vh;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.2,.9,.25,1),opacity .2s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .grab{display:none}
  .fg{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1100px){.kpis{grid-template-columns:repeat(6,1fr)}.kpi.lead{grid-column:span 2}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
@media(prefers-reduced-transparency:reduce){header.top{background:var(--paper)}nav.tabs{background:var(--ink)}}
/* ---- v4: filters + i18n ---- */
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.lang button{border:0;background:none;min-width:34px;min-height:30px;border-radius:7px;font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--ink2);cursor:pointer}
.lang button.on{background:var(--ink);color:#fff}
.sync{margin-left:auto}
.fbar{display:grid;gap:8px;margin-top:14px}
.segc{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px;background:#E7E0D4;border-radius:12px}
.segc button{border:0;background:none;border-radius:9px;min-height:38px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.segc button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.frow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
.frow::-webkit-scrollbar{display:none}
.fsel{position:relative;flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:0 30px 0 14px;min-height:38px;font-size:13px;font-weight:500;white-space:nowrap}
.fsel::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg);opacity:.6}
.fsel select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.fsel small{color:var(--ink2);font-weight:400}
.fsel.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fsel.on small{color:#A9A194}
.freset{flex:none;border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;min-height:38px;padding:0 6px;cursor:pointer}
.fcount{font-size:12px;color:var(--ink2);margin-top:2px}
@media(max-width:759px){.sync span{display:none}.sync{padding:9px}.fbar{margin-left:-14px;margin-right:-14px;padding:0 14px}.frow{margin:0 -14px;padding:0 14px}.lang button{min-width:30px}}

/* ---- v5: softer colour grading (malachite + copper) ---- */
:root{
  --paper:#F5F2EC; --card:#FFFFFF; --ink:#22302C; --ink2:#5F6B67; --line:#E3DDD2;
  --brand:#1E6B5A; --brand-2:#2C8571; --brand-t:#E2F0EB; --brand-tt:#F0F7F4;
  --accent:#C2652E; --accent-t:#FBEDE3;
  --ok:#2F7D4F; --warn:#B7801A; --bad:#C0392B;
  --sh:0 1px 2px rgba(34,48,44,.05),0 8px 24px -14px rgba(34,48,44,.22);
}
body{background:linear-gradient(180deg,#F1F5F2 0,var(--paper) 340px)}
header.top{background:rgba(241,245,242,.78)}
.brand .mark{background:var(--brand)}
.lang button.on{background:var(--brand)}
.sync{background:rgba(255,255,255,.7)}
h1{color:var(--ink)}
/* KPI hero: tinted, not black */
.kpi.lead{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);border-color:transparent;color:#fff}
.kpi.lead .eyebrow,.kpi.lead .s{color:rgba(255,255,255,.78)}
.kpi{border-color:#EAE5DC}
/* contracts total */
.cl.total{background:var(--brand-t);color:var(--ink);border-color:#CFE5DC}
.cl.total .s{color:var(--ink2)}.cl.total .s b{color:var(--brand)}

  .srow.cl4 .c-f.c-date{grid-column:1/3}
  .srow.tr3{grid-template-columns:1fr 110px 44px}
  .sim-row{grid-template-columns:1fr 92px;gap:6px 10px}
  .sim-row>div:nth-child(2){grid-column:1/-1;grid-row:2}
  .sim-row .o{grid-row:1;grid-column:2}
  .al-grid{grid-template-columns:1fr}
}

/* ---- v9: home popup + 3-button bar ---- */
nav.tabs{gap:6px;padding:6px;z-index:36}
nav.tabs button{min-width:84px}
nav.tabs button.add{min-width:96px}
@media(max-width:759px){nav.tabs button,nav.tabs button.add{flex:1;width:auto;min-width:0}}
.hscrim{position:fixed;inset:0;z-index:34;background:rgba(6,10,9,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.hscrim.on{opacity:1;pointer-events:auto}
.hmenu{position:fixed;z-index:37;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));width:min(420px,calc(100vw - 24px));
  transform:translate(-50%,16px) scale(.92);transform-origin:20% 100%;opacity:0;pointer-events:none;visibility:hidden;
  transition:transform .38s cubic-bezier(.2,.9,.25,1),opacity .2s,visibility 0s .38s;
  background:rgba(26,37,35,.86);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
  border:1px solid rgba(190,230,215,.12);border-radius:24px;padding:14px;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 30px 70px -20px rgba(0,0,0,.85)}
.hmenu.on{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto;visibility:visible;transition:transform .38s cubic-bezier(.2,.9,.25,1),opacity .2s,visibility 0s}
.hmenu-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 10px}
.hmenu-h b{font:700 17px/1 var(--disp);letter-spacing:-.01em;color:var(--ink)}
.hm-sync{font-size:12px;color:var(--ink2)}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hgrid button{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;
  min-height:68px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;transition:transform .1s,background .15s}
.hgrid button:active{transform:scale(.97)}
.hgrid button:hover{background:rgba(255,255,255,.06)}
.hgrid .hi{grid-row:1/3;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-t);color:var(--brand-2)}
.hgrid .hi svg{width:20px;height:20px}
.hgrid b{font:600 14px/1.2 var(--txt)}
.hgrid small{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hgrid button.on{border-color:rgba(92,201,169,.45);background:var(--brand-tt);box-shadow:inset 0 0 0 1px rgba(92,201,169,.25)}
.hgrid button[data-go="chauffeur"] .hi{background:var(--accent-t);color:var(--accent)}
@media(min-width:760px){.hmenu{bottom:96px}}
@media(prefers-reduced-motion:reduce){.hmenu{transform:translate(-50%,0)!important}}
@media(prefers-reduced-transparency:reduce){.hmenu{background:#1C2725}}

/* ---- v10: professional pass — calmer palette, type, structure ---- */
:root{
  --paper:#11191A; --card:#18221F; --card2:#1E2A27; --ink:#E6ECE9; --ink2:#8D9C97; --ink3:#66756F; --line:rgba(200,230,220,.08); --line2:rgba(200,230,220,.14);
  --brand:#3A9E83; --brand-2:#5DBFA2; --brand-t:rgba(58,158,131,.14); --brand-tt:rgba(58,158,131,.07);
  --accent:#D9874F; --accent-t:rgba(217,135,79,.13);
  --ok:#5BBE87; --warn:#DDB25C; --bad:#E57869;
  --sh:0 1px 2px rgba(0,0,0,.25),0 8px 24px -16px rgba(0,0,0,.6);
}
html{background:#0F1617}
body{background:radial-gradient(1100px 500px at 75% -200px,rgba(58,158,131,.10),transparent 70%),linear-gradient(180deg,#131C1C 0,#11191A 480px,#0F1617 100%);background-attachment:fixed;font-size:15px}
/* numbers: tabular sans instead of mono — calmer, more "finance" */
.num,.kpi .v,.v.num,.cl .p,.mc .big,.amt,.tbl td.num{font-family:var(--txt)!important;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em}
.kpi .v{font-weight:600;font-size:24px}
.kpi.lead .v{font-size:32px;text-shadow:none}
.eyebrow,.tbl th,.srow.head{font-family:var(--txt)!important;font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.kpi .eyebrow{font-size:10.5px}
.drv-pick b,.recent button b{font-family:var(--txt);font-weight:600;letter-spacing:.02em}
.toast:not(.on){visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.25,1),visibility 0s .35s}
/* page header */
.phead{margin:18px 0 6px}
.phead h1{margin:6px 0 4px}
h1{font-size:clamp(28px,4.4vw,40px);letter-spacing:-.025em}
h2{font-size:17px;font-weight:700}
.sec{margin-top:28px}
.sec-h{padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
/* surfaces */
.card,.kpi{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.kpi{padding:14px 16px}
.kpi.lead{background:linear-gradient(140deg,#1D3F37 0%,#182F2A 100%);border:1px solid rgba(93,191,162,.22);box-shadow:var(--sh)}
.kpi.lead .eyebrow,.kpi.lead .s{color:rgba(220,240,232,.7)}
.cl .bar>b{background:var(--brand-2);box-shadow:none}
.cl.total{background:linear-gradient(140deg,rgba(58,158,131,.13),rgba(58,158,131,.04)),var(--card)}
.btn.primary{background:var(--accent);color:#1B120B;box-shadow:0 6px 18px -10px rgba(217,135,79,.7)}
nav.tabs button.add{background:var(--accent);color:#1B120B;box-shadow:0 6px 16px -8px rgba(217,135,79,.7)}
.btn.dark{background:var(--brand-t);border-color:rgba(93,191,162,.35);color:var(--brand-2)}
.alert{border-radius:12px}
/* KPI grid: strict 2 / 3 columns */
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.kpis .kpi.lead{grid-column:1/-1!important}
@media(min-width:760px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))!important}.kpis .kpi.lead{grid-column:auto!important}.kpis .kpi:last-child{grid-column:auto!important}}
/* two-column dashboard only when there is room */
.two{display:block}
@media(min-width:1280px){.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}}
/* desktop rail */
.rail{display:none}
@media(min-width:1024px){
  .rail{display:flex;flex-direction:column;gap:6px;position:fixed;left:0;top:0;bottom:0;width:232px;padding:84px 14px 18px;border-right:1px solid var(--line);background:rgba(15,22,22,.7);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:15}
  .rail-new{width:100%;min-height:46px;margin-bottom:14px}
  .rail-new svg{width:18px;height:18px}
  .rail-n{display:flex;flex-direction:column;gap:2px}
  .rail button[data-go]{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--ink2);font-size:14px;font-weight:500;cursor:pointer;text-align:left}
  .rail button[data-go] svg{width:18px;height:18px;flex:none}
  .rail button[data-go]:hover{background:rgba(255,255,255,.04);color:var(--ink)}
  .rail button[data-go].on{background:var(--brand-t);color:var(--brand-2)}
  .rail .rb{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font:600 11px/20px var(--txt);text-align:center;font-style:normal}
  .rail-drv{margin-top:auto!important;border:1px solid var(--line)!important}
  header.top{padding-left:24px;z-index:20}
  main{padding-left:calc(232px + 40px)!important;padding-right:40px!important;max-width:none;padding-bottom:48px!important}
  main>.view{max-width:1120px;margin:0 auto}
  nav.tabs,.hmenu,.hscrim{display:none!important}
  body.driver .rail{display:none}
  body.driver main{padding-left:40px!important}
}
/* annual simulation */
.ypre{margin-top:16px}
.ylay{display:grid;gap:16px;margin-top:16px}
@media(min-width:1024px){.ylay{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}.yres{position:sticky;top:84px}}
.yres{display:grid;gap:12px}
.yhero{padding:18px;background:linear-gradient(140deg,#1D3F37,#172C27);border:1px solid rgba(93,191,162,.24)}
.yhero.neg{background:linear-gradient(140deg,#3A2420,#2A1C19);border-color:rgba(229,120,105,.3)}
.yhero .eyebrow{color:rgba(220,240,232,.7)}
.yv{font-size:clamp(30px,6vw,40px);font-weight:600;margin:6px 0 10px;color:#F2F7F5}
.ysub{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:rgba(220,240,232,.75)}
.ysub b{color:#F2F7F5;font-weight:600}
.ykpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ynote{font-size:12.5px;color:var(--ink2);margin:-2px 2px 0}
.ycard{padding:14px 16px}
.ycard .sec-h{margin-bottom:8px}
.ycard .sec-h p{display:flex;align-items:center;gap:6px;font-size:12px}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:8px}.lg.b{background:var(--brand)}.lg.c{background:var(--accent);height:3px;border-radius:2px}
.ychart{width:100%;height:auto;display:block}
.ychart .zl{stroke:var(--line2);stroke-width:1}
.ychart .ax{fill:var(--ink3);font:500 13px var(--txt)}
.ychart .cv{fill:var(--accent);font:600 13px var(--txt)}
.cl .s{flex-wrap:wrap;gap:2px 10px}
.cl .s b{font-family:var(--txt)!important;font-weight:600}
.ypl td{padding:9px 4px}
.ypl td small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.ypl tr.tot td{font-weight:600;border-top:1px solid var(--line2)}
.ypl tr.net td{font-weight:700;font-size:16px;color:var(--ok);border-top:2px solid var(--line2)}
.ypl tr.net.neg td{color:var(--bad)}
.yin{display:grid;gap:10px}
.yin .acc summary{grid-template-columns:1fr 20px;min-height:52px}
.ygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ygrid.one{grid-template-columns:1fr}
.fh{font-size:11px;color:var(--ink3);font-weight:400}
.ymix{display:grid;gap:8px}
.ymr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.12)}
.ymr .nm{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.ymr .nm i{width:12px;height:12px;border-radius:3px}
@media(min-width:760px){.ygrid{grid-template-columns:repeat(3,1fr)}.ykpis{grid-template-columns:repeat(2,1fr)}}

/* ---- v11: single Home button + sim time frame ---- */
nav.tabs.solo{padding:6px;gap:0;border-radius:22px}
nav.tabs.solo #home-btn{min-width:120px;min-height:52px;flex-direction:row;gap:8px;font-size:14px;font-weight:600;padding:0 22px;border-radius:16px;background:var(--brand-t);color:var(--brand-2)}
nav.tabs.solo #home-btn svg{width:20px;height:20px}
nav.tabs.solo #home-btn[aria-expanded="true"]{background:var(--brand);color:#0F1716}
nav.tabs.solo .badge{position:static;margin-left:2px}
@media(max-width:759px){nav.tabs.solo{left:50%;right:auto;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));border-radius:22px;border-width:1px;padding:6px}nav.tabs.solo #home-btn{flex:none;min-width:150px}}
.hmenu{bottom:calc(86px + env(safe-area-inset-bottom));transform-origin:50% 100%}
.hnew{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;margin-bottom:10px;border:0;border-radius:16px;background:var(--accent);color:#1B120B;font:600 15px/1 var(--txt);cursor:pointer;box-shadow:0 8px 20px -10px rgba(217,135,79,.75)}
.hnew svg{width:20px;height:20px}
.hnew:active{transform:scale(.98)}
.yhz{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;align-items:end}
.yhz .segc{grid-template-columns:repeat(6,1fr)}
.yhz .segc button{font-size:12.5px;min-height:40px}
.yst{max-width:220px}
@media(min-width:760px){.yhz{grid-template-columns:1fr 200px}.yst{max-width:none}}

/* ---- v12: trucks & registration certificates ---- */
.tk-bar{display:flex;gap:10px;align-items:center;margin-top:14px}
.tk-bar .search{margin:0;flex:1}
.tk-bar .btn{flex:none;min-height:46px}
.tk-f{margin-top:10px;grid-template-columns:repeat(3,1fr)}
.tk-list{display:grid;gap:10px;margin-top:14px}
@media(min-width:1280px){.tk-list{grid-template-columns:1fr 1fr;align-items:start}.tk.open{grid-column:1/-1}}
.tk{padding:0;overflow:hidden}
.tk.open{border-color:rgba(93,191,162,.3)}
.tk-h{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:4px 10px;width:100%;padding:14px 16px;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;align-items:center}
.tk-h:active{background:rgba(255,255,255,.03)}
.tk-plate{font:700 17px/1.1 var(--disp);letter-spacing:.04em}
.tk-meta{grid-row:2;font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-h .pill{grid-row:1/3;grid-column:2}
.tk-b{padding:0 16px 16px;border-top:1px solid var(--line);padding-top:14px}
.tk-b .photos{grid-template-columns:1fr 1fr}
.tk-b .ph{min-height:120px}
.tk-hint{display:block;margin-top:2px}
.tk-hint.ok{color:var(--ok)}.tk-hint.warn{color:var(--warn)}
.rail .rb-w{background:var(--warn);color:#1B120B}
@media(max-width:759px){.tk-bar{flex-direction:column;align-items:stretch}.tk-bar .btn{width:100%}}

/* ---- v13: tablet (760–1023px) ---- */
@media(min-width:760px) and (max-width:1023px){
  main{padding:4px 28px 120px!important}
  /* form = touch bottom-sheet with steps, centred */
  .sheet{left:50%!important;right:auto!important;top:auto!important;bottom:0!important;width:min(720px,100%)!important;height:90vh;max-height:none!important;border-radius:24px 24px 0 0!important;
    transform:translate(-50%,105%) scale(1)!important;opacity:1!important;pointer-events:auto!important;transition:transform .42s cubic-bezier(.2,.9,.25,1),visibility 0s .42s!important}
  .sheet.on{transform:translate(-50%,0)!important;transition:transform .42s cubic-bezier(.2,.9,.25,1)!important}
  .sheet:not(.on){visibility:hidden}
  .grab{display:block!important;box-sizing:content-box;width:40px;padding:10px 60px;background-clip:content-box;margin:0 auto;cursor:grab}
  .sheet-h{padding:4px 22px 8px;border-bottom:0}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 22px 6px;padding:4px;border-radius:12px}
  .steps button{border:0;background:none;border-radius:9px;min-height:44px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
  .steps button b{font:600 11px/1 var(--txt);width:20px;height:20px;border-radius:6px;display:grid;place-items:center}
  .sheet-b{padding:6px 22px 22px}
  fieldset{display:none;margin-top:10px}
  fieldset.cur{display:block;animation:in .22s cubic-bezier(.2,.8,.2,1)}
  legend{display:none}
  .fg{grid-template-columns:repeat(2,1fr)}
  .fg label:has(input[type=datetime-local]){grid-column:auto}
  .sheet-f{padding:12px 22px max(14px,env(safe-area-inset-bottom))}
  #next{display:inline-flex}
  /* bigger touch targets */
  .chip,.fsel{min-height:42px}
  .segc button{min-height:42px}
  nav.tabs.solo #home-btn{min-height:56px;min-width:170px;font-size:15px}
  .hmenu{width:min(480px,calc(100vw - 48px))}
  .hgrid button{min-height:76px}
  /* layouts */
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .clgrid{grid-template-columns:repeat(2,1fr)}
  .mcards.mob{display:grid;grid-template-columns:repeat(2,1fr)}
  .desk{display:none!important}
  .prices{grid-template-columns:1fr 1fr}
  .yhz{grid-template-columns:1fr 190px}
  .ygrid{grid-template-columns:repeat(2,1fr)}
  .ykpis{grid-template-columns:repeat(2,1fr)}
  .tk-list{grid-template-columns:1fr}
  .rep-sum{grid-template-columns:repeat(4,1fr)}
}
/* small laptops / tablet landscape with rail: give content room */
@media(min-width:1024px) and (max-width:1279px){
  main{padding-left:calc(232px + 28px)!important;padding-right:28px!important}
  .ylay{grid-template-columns:1fr!important}
  .yres{position:static!important}
  .ygrid{grid-template-columns:repeat(3,1fr)}
  .clgrid{grid-template-columns:repeat(3,1fr)}
}

/* fixes: select chevron + grab handle after background shorthands */
label.f select{background-color:#121A19;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%)!important;background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%!important;background-size:5px 5px,5px 5px!important;background-repeat:no-repeat!important;padding-right:34px}
.grab{background-clip:content-box!important}
</style>

<div class="app">

<main>
<!-- ============ DASHBOARD ============ -->
<section class="view active" id="v-tableau">
  <p class="eyebrow" style="margin-top:14px" data-t="eyeDash"></p>
  <h1 data-t="dash"></h1>

/* ================= formatting ================= */
const L = () => t('loc');
const fmt = (v, d=0) => isFinite(v) ? v.toLocaleString(L(),{minimumFractionDigits:d,maximumFractionDigits:d}) : '—';
const money = (v, d=0) => isFinite(v) ? fmt(v,d) + ' ' + esc(config.cur||'') : '—';
const pct = v => isFinite(v) ? fmt(v*100,0) + ' %' : '—';
const pct1 = v => isFinite(v) ? fmt(v*100,1) + ' %' : '—';
const dt = s => { if(!s) return '—'; const d = new Date(s); return isNaN(d) ? '—' : d.toLocaleString(L(),{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); };
const nowLocal = (off=0) => { const d=new Date(Date.now()+off); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };

/* ================= business logic ================= */
const clientOf = nm => clients.find(c => c.nom === nm);
function sellPrice(v, marche = config.marche){ return n(v.pVente) || n(clientOf(v.client)?.prix) || n(marche[v.prod]); }
function calc(v, marche = config.marche){
  const achat = n(v.tDep) * n(v.pAchat);
  const fret = n(v.tDep) * n(v.tarifT);
  const frais = fret + n(v.pRoute) + n(v.pMine) + n(v.cRetard);
  const total = achat + frais, km = n(v.km), arrived = !!v.hArr && !v.plan;
  const perte = arrived && v.tDech !== '' && v.tDech != null ? n(v.tDep) - n(v.tDech) : NaN;
  let onTime = null;
  if (arrived) onTime = v.hPrev ? new Date(v.hArr) <= new Date(v.hPrev) : n(v.cRetard) === 0;
  const tLivre = arrived ? n(v.tDech || 0) : 0, revenu = tLivre * sellPrice(v, marche);
  return {achat, fret, frais, total, km, coutKm: km>0 ? total/km : NaN, fraisKm: km>0 ? frais/km : NaN,
    perte, pertePct: n(v.tDep)>0 && isFinite(perte) ? perte/n(v.tDep) : NaN, onTime, arrived, tLivre, revenu, marge: arrived ? revenu - total : NaN};
}
const lateH = () => n(config.alerts?.late ?? 2);
const isLate = v => { if (v.plan) return false; const c = calc(v); return c.onTime === false || (!c.arrived && v.hPrev && Date.now() > new Date(v.hPrev).getTime() + lateH()*36e5); };
const real = () => voyages.filter(v => !v.plan);
function applyFilters(list, {period=true, status=false, keepPlan=false} = {}){
  const days = state.period==='all' ? Infinity : +state.period, lim = Date.now() - days*DAY;
  return list.filter(v => {
    if (state.prod && v.prod !== state.prod) return false;
    if (state.client && (v.client||'') !== state.client) return false;
    if (state.trans && (v.transporteur||'').trim() !== state.trans) return false;
    if (period && days !== Infinity && new Date(v.hDep||v.created).getTime() < lim) return false;
    if (status && state.status) {
      const a = !!v.hArr;
      if (state.status==='plan') return !!v.plan;
      if (v.plan) return false;
      if (state.status==='route' && a) return false;
      if (state.status==='done' && !a) return false;
      if (state.status==='late' && !isLate(v)) return false;
    } else if (!status && !keepPlan && v.plan) return false;
    return true;
  });
}
const activeCount = withStatus => ['prod','client','trans'].filter(k=>state[k]).length + (withStatus && state.status ? 1 : 0) + (state.period!==F0.period ? 1 : 0);
const label = v => [v.plaque && v.plaque.toUpperCase(), v.client || v.lArr].filter(Boolean).join(' · ');

function clientPace(c){
  const del = real().filter(v=>v.client===c.nom && v.hArr);
  const liv = del.reduce((a,v)=>a+n(v.tDech),0);
  const reste = Math.max(0, n(c.obj) - liv);
  const since = Date.now() - 14*DAY;
  const cur = del.filter(v=>new Date(v.hArr).getTime()>=since).reduce((a,v)=>a+n(v.tDech),0) / 14;
  const loads = real().filter(v=>v.client===c.nom).map(v=>n(v.tDep)).filter(x=>x>0);
  const allLoads = real().map(v=>n(v.tDep)).filter(x=>x>0);
  const avgLoad = (loads.length ? loads : allLoads).reduce((a,b)=>a+b,0) / Math.max(1,(loads.length ? loads : allLoads).length) || 30;
  if (!c.fin) return {reste, cur, req:NaN};
  const daysLeft = Math.ceil((new Date(c.fin+'T23:59').getTime() - Date.now())/DAY);
  if (daysLeft <= 0) return {reste, cur, req:NaN, over: reste>0, daysLeft};
  const req = reste / daysLeft;
  return {reste, cur, req, daysLeft, trucks: req/avgLoad};
}

/* ================= alerts ================= */
function computeAlerts(){
  const out = [], lossMax = n(config.alerts?.loss ?? 2)/100;
  const since = Date.now() - 30*DAY;
  real().forEach(v => {
    const c = calc(v);
    if (c.arrived && new Date(v.hArr).getTime() >= since && isFinite(c.pertePct) && c.pertePct > lossMax) out.push({lvl:'bad', ic:'alert', txt:t('aLoss', pct1(c.pertePct), label(v)), id:v.id});
    if (!v.hArr && v.hPrev) { const over = (Date.now() - new Date(v.hPrev).getTime())/36e5; if (over > lateH()) out.push({lvl:'bad', ic:'clock', txt:t('aLate', fmt(over,0), label(v)), id:v.id}); }
  });
  voyages.filter(v=>v.plan && v.hDep && Date.now() > new Date(v.hDep).getTime() + 36e5).forEach(v => out.push({lvl:'warn', ic:'clock', txt:t('aPlan', label(v)), id:v.id}));
  camions.forEach(c => { const st = tkStatus(c); if (st.k === 'exp') out.push({lvl: st.cls==='late'?'bad':'warn', ic:'clock', txt:t('aTk', c.plaque, st.lbl.toLowerCase()), tk: plateId(c.plaque)}); });
  clients.forEach(c => { const p = clientPace(c); if (isFinite(p.req) && p.reste > 0 && p.req > p.cur * 1.05) out.push({lvl:'warn', ic:'trend', txt:t('aPace', c.nom, fmt(p.req,0), fmt(p.cur,0)), client:c.nom}); });
  return out;
}
function renderAlerts(){
  const al = computeAlerts(), b = $('#badge');
  const nBad = al.filter(a=>a.lvl==='bad').length || al.length;
  b.hidden = !al.length; b.textContent = al.length > 9 ? '9+' : al.length;
  const shown = al.slice(0,4);
  $('#alerts').innerHTML = shown.map((a,i)=>`<div class="alert ${a.lvl}" data-al="${i}" role="button" tabindex="0">${ICON[a.ic]}<div>${esc(a.txt)}</div><span class="go">${t('aOpen')} ›</span></div>`).join('') +
    (al.length > 4 ? `<div class="fcount" style="padding-left:4px">${t('aMore', al.length-4)}</div>` : '');
  $('#alerts').onclick = e => { const el = e.target.closest('[data-al]'); if (!el) return; const a = shown[+el.dataset.al];
    if (a.tk) { tkOpen = a.tk; go('camions'); } else if (a.id) { const v = voyages.find(x=>x.id===a.id); if (v) openSheet(v, 2); } else if (a.client) { state.client = a.client; render(); $('#sec-clients').scrollIntoView({behavior:'smooth'}); } };
  return nBad;
}

/* ================= filter bar ================= */
function fselect(key, lab, opts){
  const cur = state[key], curLabel = opts.find(o=>o[0]===cur)?.[1];
  return `<label class="fsel ${cur?'on':''}"><small>${lab}</small>${cur ? esc(curLabel) : esc(t('all'))}
    <select data-f="${key}" aria-label="${esc(lab)}"><option value="">${esc(t('all'))}</option>${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
}
function renderFilterBars(){
  const trans = [...new Set(voyages.map(v=>(v.transporteur||'').trim()).filter(Boolean))].sort();
  const cls = [...new Set([...clients.map(c=>c.nom), ...voyages.map(v=>v.client).filter(Boolean)])].sort();
  document.querySelectorAll('[data-fbar]').forEach(el => {
    const withStatus = el.hasAttribute('data-status');
    const periods = [['7',t('p7')],['30',t('p30')],['90',t('p90')],['all',t('pAll')]];
    el.innerHTML = `<div class="segc" role="group">${periods.map(([k,l])=>`<button type="button" data-pp="${k}" class="${state.period===k?'on':''}" aria-pressed="${state.period===k}">${l}</button>`).join('')}</div>
      <div class="frow">
        ${withStatus ? fselect('status', t('fSt'), [['route',t('stRoute')],['done',t('stDone')],['late',t('stLate')],['plan',t('stPlan')]]) : ''}
        ${fselect('client', t('fCl'), cls.map(c=>[c,c]))}
        ${fselect('prod', t('fProd'), PRODS.map(p=>[p.k, pn(p.k)]))}
        ${trans.length ? fselect('trans', t('fTr'), trans.map(x=>[x,x])) : ''}
        ${activeCount(withStatus) ? `<button type="button" class="freset" data-freset>${t('reset')}</button>` : ''}
      </div>`;
  });
}
document.addEventListener('change', e => { const k = e.target.dataset?.f; if (k) { state[k] = e.target.value; render(); } });
document.addEventListener('click', e => {
  const p = e.target.closest('[data-pp]'); if (p) { state.period = p.dataset.pp; render(); return; }
  if (e.target.closest('[data-freset]')) { Object.assign(state, F0); render(); }

/* ================= dashboard ================= */
const col = r => r>=.85?'var(--ok)':r>=.6?'var(--warn)':isFinite(r)?'var(--bad)':'inherit';
const bar = r => `<div class="bar"><b style="width:${isFinite(r)?Math.min(1,r)*100:0}%;background:${col(r)}"></b></div>`;

function groupStats(rows, keyFn){
  const g = {}, sum = (a,f) => a.reduce((s,r)=>s+f(r),0);
  rows.forEach(r => { const k = keyFn(r.v) || '—'; (g[k] ||= []).push(r); });
  return Object.entries(g).map(([k,a]) => {
    const tt = a.filter(r=>r.c.onTime!==null), ok = tt.filter(r=>r.c.onTime).length, km = sum(a,r=>r.c.km);
    const d = a.filter(r=>r.c.arrived), td = sum(d,r=>n(r.v.tDep)), tch = sum(d,r=>n(r.v.tDech));
    return {k, n:a.length, rate: tt.length? ok/tt.length : NaN, ck: km? sum(a,r=>r.c.total)/km : NaN, fk: km? sum(a,r=>r.c.frais)/km : NaN,
      perte: td? (td-tch)/td : NaN, liv: tch, cost: sum(a,r=>r.c.total), rev: sum(d,r=>r.c.revenu), marge: sum(d,r=>r.c.marge||0), hasD: d.length};
  });
}

function renderClients(){
  const del = {}, enr = {};
  applyFilters(real(), {period:false}).forEach(v => { if (!v.client) return; if (v.hArr) del[v.client] = (del[v.client]||0) + n(v.tDech); else enr[v.client] = (enr[v.client]||0) + n(v.tDep); });
  let st = clients.map(c => ({...c, liv: del[c.nom]||0, route: enr[c.nom]||0}));
  if (state.client) st = st.filter(c => c.nom === state.client);
  if (!clients.length) { $('#cl-sum').textContent=''; $('#clients').innerHTML = `<div class="card empty"><b>${t('noClients')}</b>${t('noClientsTxt')}</div>`; return; }
  const tObj = st.reduce((a,c)=>a+n(c.obj),0), tLiv = st.reduce((a,c)=>a+c.liv,0), tR = st.reduce((a,c)=>a+c.route,0);
  $('#cl-sum').textContent = t('nClients', st.length);
  const paceHtml = c => { if (!c) return ''; const p = clientPace(c);
    if (n(c.obj) && p.reste <= 0) return `<div class="pace"><span class="ok">${t('paceDone')}</span></div>`;
    if (p.over) return `<div class="pace"><span class="bad">${t('paceOver')}</span></div>`;
    if (!isFinite(p.req)) return '';
    const behind = p.req > p.cur*1.05;
    return `<div class="pace"><span>${t('paceDays', p.daysLeft)}</span><span class="${behind?'bad':'ok'}">${t('paceReq', fmt(p.req,0))}</span><span>${t('paceCur', fmt(p.cur,0))}</span>${isFinite(p.trucks)?`<span>${t('paceTrucks', fmt(Math.ceil(p.trucks),0))}</span>`:''}</div>`; };
  const card = (nm, liv, obj, route, cls='', c=null) => { const r = obj ? Math.min(1, liv/obj) : 0;
    return `<div class="card cl ${cls}"><div class="t">${esc(nm)}</div><div class="p">${obj?fmt(liv/obj*100,1)+' %':'—'}</div>
      <div class="bar"><b class="${r>=1?'full':''}" style="width:${r*100}%"></b></div>
      <div class="s"><span><b>${fmt(liv,0)}</b> / ${fmt(obj,0)} t</span><span>${route?'<b>'+fmt(route,0)+' t</b> '+t('onRoute')+' · ':''}${t('remain')} <b>${fmt(Math.max(0,obj-liv),0)} t</b></span></div>${paceHtml(c)}</div>`; };
  const sorted = st.sort((a,b)=>n(b.obj)-n(a.obj)), lim = sorted.length;
  $('#clients').innerHTML = (sorted.length>1 ? card(t('totalContracts'), tLiv, tObj, tR, 'total') : '') +
    sorted.slice(0,lim).map(c => card(c.nom, c.liv, n(c.obj), c.route, '', c)).join('') +
    '';
}

function photoUrl(ref){
  if (!ref) return null;
  if (ref.startsWith('a:')) return '/_blob/' + ref.slice(2);
  if (ref.startsWith('d:')) return ref.slice(2);
  if (ref.startsWith('p:')) { const id = ref.slice(2); if (photoCache[id]) return photoCache[id];
    if (db && photoCache[id] === undefined) { photoCache[id] = null; db.doc('photos/'+id).get().then(s => { if (s.exists) { photoCache[id] = s.data().d; render(); } }).catch(()=>{}); }
    return null; }
  return null;
}
const pendingPhoto = (vid, kind) => outbox.find(o => o.type==='photo' && o.vid===vid && o.kind===kind)?.dataUrl;

  const K = avg(rv.map(v=>n(v.km)).filter(Boolean)); if (isFinite(K)) b.km = Math.round(K);

  // group by quarter when horizon > 12 months
  const groups = [];
  if (T.N > 12) { for (let i=0; i<months.length; i+=3) { const g = months.slice(i,i+3); groups.push({net:g.reduce((a,x)=>a+x.net,0), rainy:g.filter(x=>x.rainy).length>=2, lab:`T${Math.floor(g[0].m/3)+1} '${String(g[0].yr).slice(2)}`, tip:`${mname(g[0])}–${mname(g[g.length-1])} ${g[g.length-1].yr}`}); } }
  else months.forEach(x => groups.push({net:x.net, rainy:x.rainy, lab: mname(x).slice(0,3) + (multiYear && x.m===0 ? ` '${String(x.yr).slice(2)}` : ''), tip:`${mname(x)} ${x.yr}`}));
  const G = groups.length, mlabG = i => groups[i].lab;

  let cum = 0; const cums = groups.map(x => cum += x.net);

  const line = cums.map((c,i)=>`${i?'L':'M'}${(PL+i*bw+bw/2).toFixed(1)},${yc(c).toFixed(1)}`).join(' ');
  const svg = `<svg viewBox="0 0 ${W} ${H}" class="ychart" role="img" aria-label="${esc(t('yChart'))}">

    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${cums.map((c,i)=>`<circle cx="${(PL+i*bw+bw/2).toFixed(1)}" cy="${yc(c).toFixed(1)}" r="3" fill="var(--accent)"/>`).join('')}
    <text x="${W-PR}" y="${Math.max(12, yc(cums[G-1])-8).toFixed(1)}" text-anchor="end" class="cv">${money(cums[G-1])}</text></svg>`;
  const pl = (lab, v, cls='', sub='') => `<tr class="${cls}"><td>${lab}${sub?`<small>${sub}</small>`:''}</td><td class="r num">${money(v)}</td><td class="r num">${T.deliv?money(v/T.deliv,2):'—'}</td></tr>`;
  $('#y-res').innerHTML = `

      <div class="eyebrow">${t('yNetP', HZL)}</div>
      <div class="yv num">${money(T.net)}</div>
      <div class="ysub"><span>${t('yMargin')} <b class="num">${pct1(T.margin)}</b></span><span>${t('yRev')} <b class="num">${money(T.rev)}</b></span></div>
    </div>
    <div class="ykpis">

      <div class="card kpi"><div class="eyebrow">${t('yBE')}</div><div class="v num">${isFinite(T.beTrips)?fmt(T.beTrips,1):'∞'}</div><div class="s">${t('yBEvs', fmt(n(Y.trucks)*n(Y.tpt),1))}</div></div>
      <div class="card kpi"><div class="eyebrow">${t('yCostKm')}</div><div class="v num">${money(T.costKm,2)}</div><div class="s">${fmt(T.km,0)} km</div></div>

const plateId = p => String(p||'').toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'') || 'X';
function tkStatus(c){
  const has = c && c.photos && (c.photos.recto || c.photos.verso);
  if (!has) return {k:'miss', lbl:t('tkNone'), cls:'late'};
  if (c.exp) { const d = Math.ceil((new Date(c.exp+'T23:59').getTime() - Date.now())/DAY);
    if (d < 0) return {k:'exp', lbl:t('tkExpd'), cls:'late'};
    if (d <= 30) return {k:'exp', lbl:t('tkSoon', d), cls:'route'}; }
  return {k:'ok', lbl:t('tkOk'), cls:'ok'};
}
function tkAll(){
  const map = {};
  camions.forEach(c => map[plateId(c.plaque)] = {...c});
  real().concat(voyages.filter(v=>v.plan)).sort((a,b)=>new Date(b.hDep||b.created)-new Date(a.hDep||a.created)).forEach(v => {
    const id = plateId(v.plaque); if (!v.plaque) return;
    const c = map[id] || (map[id] = {plaque: v.plaque.toUpperCase(), auto: true});
    c.trips = (c.trips||0) + 1;
    if (!c.chauffeur) c.chauffeur = v.chauffeur; if (!c.tel) c.tel = v.tel; if (!c.transporteur) c.transporteur = v.transporteur;
  });
  return Object.values(map);
}

/* ================= photos ================= */
async function compress(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let max = 1100, q = 0.62, out;
    for (let k=0; k<4; k++) {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      out = c.toDataURL('image/jpeg', q);
      if (out.length < 190000) break;
      max *= 0.8; q -= 0.08;
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}
const dataUrlToBlob = d => { const [h, b] = d.split(','); const bin = atob(b), arr = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr], {type: h.match(/:(.*?);/)[1]}); };
async function storePhoto(dataUrl){
  if (assets) { try { const r = await assets.upload(dataUrlToBlob(dataUrl), {type:'image/jpeg'}); return 'a:' + r.id; } catch (e) { if (e?.code === 'store_unavailable' || e?.code === 'upstream_error') throw {code:'unavailable'}; } }
  if (db) { const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); await withTimeout(db.doc('photos/'+id).set({d:dataUrl, at:new Date().toISOString()})); photoCache[id] = dataUrl; return 'p:' + id; }
  return 'd:' + dataUrl;
}

    return `<label class="ph ${src?'has':''}">${src?`<img src="${esc(src)}" alt="">`:ICON.cam+`<span>${t('phAdd')}</span>`}<span class="lbl">${t(k==='load'?'phLoad':'phUnload')}</span><input type="file" accept="image/*" capture="environment" data-ph="${k}"></label>`; }).join('');
}

});

  }

}

/* ================= storage: db + offline outbox + local cache ================= */
const LS = 'registre-transport-v1', OB = 'registre-outbox-v1', CACHE = 'registre-cache-v1';
let outbox = []; try { outbox = JSON.parse(LSget(OB) || '[]'); } catch { outbox = []; }
const saveOutbox = () => { LSset(OB, JSON.stringify(outbox)); updateSync(); };
function queue(item){
  if (item.path) outbox = outbox.filter(o => !(o.path === item.path && o.type !== 'photo'));
  outbox.push({...item, q: Date.now()});
  if (!LSset(OB, JSON.stringify(outbox))) { // storage full: drop photo payloads first
    outbox = outbox.filter(o => o.type !== 'photo'); LSset(OB, JSON.stringify(outbox));
  }
  updateSync();
}
const withTimeout = (p, ms=7000) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), ms))]);
const transient = e => !e || ['unavailable','timeout','resource_exhausted'].includes(e.code);
function applyLocal(op){
  if (op.type==='set' && op.path.startsWith('voyages/')) { const i = voyages.findIndex(v=>v.id===op.data.id); i>=0 ? voyages[i]=op.data : voyages.push(op.data); }
  if (op.type==='del' && op.path.startsWith('voyages/')) voyages = voyages.filter(v=>'voyages/'+v.id !== op.path);
  if (op.type==='set' && op.path==='config/clients') clients = op.data.list;
  if (op.type==='set' && op.path.startsWith('camions/')) { const id = op.path.slice(8), i = camions.findIndex(c=>plateId(c.plaque)===id); i>=0 ? camions[i]=op.data : camions.push(op.data); }
  if (op.type==='del' && op.path.startsWith('camions/')) { const id = op.path.slice(8); camions = camions.filter(c=>plateId(c.plaque)!==id); }
  if (op.type==='set' && op.path==='config/prix') { config = {...config, ...op.data}; sim = null; }
}
async function dbWrite(op){
  if (!db) { applyLocal(op); localPersist(); render(); return 'ok'; }
  applyLocal(op); render();
  if (!navigator.onLine) { queue(op); return 'queued'; }
  try { await withTimeout(op.type==='del' ? db.doc(op.path).delete() : db.doc(op.path).set(op.data)); return 'ok'; }
  catch (e) { if (transient(e)) { queue(op); return 'queued'; } throw e; }
}
let flushing = false;
async function flush(){
  if (!db || flushing || !outbox.length || !navigator.onLine) return;
  flushing = true;
  try {
    for (const op of [...outbox]) {
      try {
        if (op.type === 'photo' && op.cam) {
          const ref = await storePhoto(op.dataUrl);
          const c = camions.find(x=>plateId(x.plaque)===op.cam);
          if (c) { const nc = {...c, photos:{...(c.photos||{}), [op.kind]: ref}}; await withTimeout(db.doc('camions/'+op.cam).set(nc)); }
        } else if (op.type === 'photo') {
          const ref = await storePhoto(op.dataUrl);
          const v = voyages.find(x=>x.id===op.vid);
          if (v) { const nv = {...v, photos:{...(v.photos||{}), [op.kind]: ref}}; await withTimeout(db.doc('voyages/'+v.id).set(nv)); }
        } else if (op.type === 'del') await withTimeout(db.doc(op.path).delete());
        else await withTimeout(db.doc(op.path).set(op.data));
        outbox = outbox.filter(o => o !== op && !(o.q===op.q && o.path===op.path && o.vid===op.vid)); saveOutbox();
      } catch (e) { if (transient(e)) break; outbox = outbox.filter(o => o !== op); saveOutbox(); }
    }
  } finally { flushing = false; render(); }
}
window.addEventListener('online', () => { setSync('on','sOk'); flush(); });
window.addEventListener('offline', () => setSync('off','sOff'));
setInterval(flush, 20000);
function overlayOutbox(){ outbox.forEach(op => { if (op.type!=='photo') applyLocal(op); }); }
let cacheT; function cacheSave(){ if (!db) return; clearTimeout(cacheT); cacheT = setTimeout(() => LSset(CACHE, JSON.stringify({voyages, clients, config, camions})), 800); }
function cacheLoad(){ try { const o = JSON.parse(LSget(CACHE) || 'null'); if (o) { voyages = o.voyages||[]; clients = o.clients||[]; camions = o.camions||[]; config = {...config, ...o.config}; sim = null; } } catch {} }
function localPersist(){ LSset(LS, JSON.stringify({voyages, config, clients, camions})); }
const store = {
  saveVoyage: d => dbWrite({type:'set', path:'voyages/'+d.id, data:d}),
  deleteVoyage: id => dbWrite({type:'del', path:'voyages/'+id}),
  saveClients: list => dbWrite({type:'set', path:'config/clients', data:{list}}),
  saveConfig: c => dbWrite({type:'set', path:'config/prix', data:c})
};
function normConfig(d){ return {simY:d.simY||null, cur:d.cur||'USD', achat:{...config.achat,...(d.achat||{})}, marche:{...config.marche,...(d.marche||{})}, tarifs:{...(d.tarifs||{})}, alerts:{loss:2, late:2, ...(d.alerts||{})}}; }
async function init(){
  cacheLoad(); applyStatic(); render();
  let cl = null;
  try { cl = window.claude && await window.claude.use('db'); } catch { cl = null; }
  try { downloads = window.claude ? await window.claude.use('downloads') : null; } catch { downloads = null; }
  if (!cl) {
    db = null; try { const o = JSON.parse(LSget(LS)||'{}'); voyages = o.voyages||[]; clients = o.clients||[]; camions = o.camions||[]; if(o.config) config = normConfig(o.config); } catch {}
    sim = null;
    if (!clients.length) { clients = DEFAULT_CLIENTS.map(c=>({...c, prix:0, fin:''})); localPersist(); }
    setSync('off','sLocal'); render(); return;
  }
  db = cl;
  try { assets = await window.claude.use('assets'); } catch { assets = null; }
  let loaded = false;
  const timer = setTimeout(() => { if(!loaded) setSync('', navigator.onLine ? 'sSlow' : 'sOff'); }, 10000);
  db.collection('voyages').onSnapshot(snap => {
    voyages = snap.docs.map(d => ({...d.data(), id:d.id})); overlayOutbox();
    if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); setSync('on','sOk'); flush(); }
    render();
  }, err => { clearTimeout(timer); setSync('off', err.code==='revoked'?'sRevoked':'sOff'); });
  db.collection('camions').onSnapshot(snap => { camions = snap.docs.map(d => ({...d.data()})); overlayOutbox(); render(); }, () => {});
  db.doc('config/clients').onSnapshot(s => {
    clients = s.exists && Array.isArray(s.data().list) ? s.data().list.map(c=>({nom:String(c.nom||''), obj:n(c.obj), prix:n(c.prix), fin:String(c.fin||'')})).filter(c=>c.nom) : [];
    render();
  }, () => {});
  db.doc('config/prix').onSnapshot(s => { if (s.exists) { config = normConfig(s.data()); sim = {...config.marche}; } render(); }, () => {});
  try { const u = await window.claude.use('user'); const w = u && await u.can?.('data.write'); if (w === false) { canWriteFlag = false; ['#add','#rail-new','#save-prix','#cl-save','#cl-add','#tr-save','#tr-add','#al-save','#y-save','#y-apply','#tk-add'].forEach(s=>{ const el=$(s); if (el) el.hidden=true; }); } } catch {}
}
let h0 = location.hash.slice(1);
if (LSget('registre-driver') === '1' && h0 !== 'tableau' && h0 !== 'prix') h0 = 'chauffeur';
if (VIEWS.includes(h0) && h0 !== 'tableau') { state.view = h0; document.body.classList.toggle('driver', h0==='chauffeur'); document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id==='v-'+h0)); document.querySelectorAll('#tabs button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v===h0));  }
init();
})();
</script>
